---
layout: portal
title: Reward Nominations
title_key: "nominate.page_title"
permalink: /nominate.html
lang: "en"
strings: [nominate]
---

<div class="content-pane portal-pane-sm" id="nominate-app">
  <div id="loading-state" class="status-banner">{{ "nominate.loading" | t }}</div>
  <div id="error-state" class="status-banner warning" style="display: none;"></div>

  <div id="form-container" style="display: none;">
    <div class="portal-header">
      <div class="alliance-badge-lg" id="display-alliance">[TAG]</div>
      <div class="sub-text" id="display-period"></div>
    </div>

    <div id="set2-banner" class="nomination-alert-banner"></div>

    <form id="nomination-form">
      <div class="smart-paste-box">
        <label for="ranked-input">{{ "nominate.players_label" | t }}</label>
        <p class="smart-paste-desc">{{ "nominate.players_help" | t }}</p>
        <textarea id="ranked-input" rows="10" placeholder="{{ "nominate.players_placeholder" | t }}"></textarea>
      </div>

      <!-- Chests the King has already handed out in the game: locked, kept whatever the list says -->
      <div id="locked-box" class="nominate-locked" style="display: none;"></div>

      <div class="slot-group-title" id="assign-title">{{ "nominate.who_gets_what" | t }}</div>
      <div class="sub-text" id="assign-summary"></div>
      <div id="assign-list" class="nominate-assign-list"></div>

      <div id="save-status" class="status-banner" style="display: none;"></div>
      <button type="submit" id="btn-submit" class="submit-plan-btn btn-fw-lg">{{ "nominate.save" | t }}</button>
    </form>
  </div>
</div>

<script>
  (function () {
    const token = new URLSearchParams(window.location.search).get('token');
    const elLoading = document.getElementById('loading-state');
    const elError = document.getElementById('error-state');
    const elForm = document.getElementById('form-container');
    const input = document.getElementById('ranked-input');

    // Same order as api/_nomination_assign.js (CHEST_ORDER): best chest first.
    // set 1 = King's Commendation ('standard'), set 2 = King of Battle Reward ('kingdom_war').
    const CHEST_ORDER = [
      ['kingdom_war', 'commanders_will'],
      ['standard', 'commanders_will'],
      ['kingdom_war', 'loyal_servant'],
      ['standard', 'loyal_servant'],
      ['kingdom_war', 'followers_heart'],
      ['standard', 'followers_heart'],
    ];
    // The in-game chest names (common.chests in _data/<lang>/tools.yml).
    const CHEST_NAMES = {
      standard: { commanders_will: t('common.chests.commanders_will'), loyal_servant: t('common.chests.loyal_servant'), followers_heart: t('common.chests.followers_heart') },
      kingdom_war: { commanders_will: t('common.chests.honor_vanguard'), loyal_servant: t('common.chests.fearless_hero'), followers_heart: t('common.chests.logistics_support') },
    };
    // The week's name from its number, as the server's weekLabel() does (0 = Off-Week).
    const weekName = (p) => (Number(p.week) === 0 ? t('common.off_week') : t('common.kw_week', { n: p.week }));
    const GLYPH = { commanders_will: 'gold', loyal_servant: 'purple', followers_heart: 'blue' };

    /** Chest for each position of the list, best first (null = reserve). */
    function chestsInOrder(counts) {
      const out = [];
      for (const [pool, chest] of CHEST_ORDER) {
        const n = (counts && counts[pool] && counts[pool][chest]) || 0;
        for (let i = 0; i < n; i++) out.push({ pool, chest });
      }
      return out;
    }

    // Handed out by the King already ({pool, chest, name}): not part of the editable list.
    let locked = [];
    const isLocked = (name) => locked.some((l) => l.name.toLowerCase() === name.toLowerCase());

    /** Chest counts with the handed-out chests taken off (they are already given). */
    function countsLeft(counts) {
      const left = JSON.parse(JSON.stringify(counts || {}));
      for (const l of locked) {
        if (left[l.pool] && left[l.pool][l.chest] > 0) left[l.pool][l.chest]--;
      }
      return left;
    }

    function namesFromInput() {
      const seen = new Set();
      const names = [];
      for (const raw of input.value.split(/[\n,]+/)) {
        const name = raw.trim();
        if (!name || seen.has(name.toLowerCase()) || isLocked(name)) continue;
        seen.add(name.toLowerCase());
        names.push(name);
      }
      return names;
    }

    function duplicatesInInput() {
      const seen = new Set();
      const dupes = [];
      for (const raw of input.value.split(/[\n,]+/)) {
        const name = raw.trim();
        if (!name) continue;
        if (seen.has(name.toLowerCase())) dupes.push(name);
        seen.add(name.toLowerCase());
      }
      return dupes;
    }

    let data = null;

    async function load() {
      if (!token || !token.includes('.')) return showError(t('nominate.link_incomplete'));
      try {
        const res = await fetch(`/api/nominate?token=${encodeURIComponent(token)}&t=${Date.now()}`);
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
        data = body;
      } catch (err) {
        return showError(t('nominate.load_failed', { error: err.message }));
      }
      const p = data.period;
      if (!p.open) {
        return showError(t('nominate.closed', { when: formatTime(p.nextOpensAt) }));
      }

      document.getElementById('display-alliance').textContent = `[${data.alliance.tag}]`;
      document.getElementById('display-period').textContent =
        t('nominate.header', { rank: data.alliance.rank, week: weekName(p), when: formatTime(p.closesAt) });

      const banner = document.getElementById('set2-banner');
      if (!p.kwWeek) {
        banner.textContent = t('nominate.banner_off_week');
      } else if (p.result === 'won') {
        banner.textContent = t('nominate.banner_won');
      } else if (p.result === 'lost') {
        banner.textContent = t('nominate.banner_lost');
      } else {
        banner.textContent = t('nominate.banner_pending', { when: formatTime(p.battleEndsAt) });
      }

      locked = data.alliance.handedOut || [];
      input.value = (data.alliance.ranked || []).filter((n) => !isLocked(n)).join('\n');
      elLoading.style.display = 'none';
      elForm.style.display = 'block';
      render();
    }

    function render() {
      const names = namesFromInput();
      const pending = data.period.kwWeek && data.period.result === 'pending';
      const now = chestsInOrder(countsLeft(data.alliance.chests));
      const ifWon = pending ? chestsInOrder(countsLeft(data.alliance.chestsIfWon)) : null;

      const lockedBox = document.getElementById('locked-box');
      lockedBox.style.display = locked.length ? 'block' : 'none';
      lockedBox.innerHTML = locked.length
        ? `<div class="slot-group-title">${escapeHtml(t('nominate.handed_out_title', { n: locked.length }))}</div>
           <p class="sub-text">${escapeHtml(t('nominate.handed_out_help'))}</p>` +
          locked
            .map(
              (l) => `<div class="nominate-assign-row is-locked">
                <span class="slot-num">🔒</span>
                <span class="player-ign">${escapeHtml(l.name)}</span>
                <span class="nominate-chest"><span class="chest-glyph ${GLYPH[l.chest]}"></span><span>${escapeHtml(CHEST_NAMES[l.pool][l.chest])}</span></span>
              </div>`,
            )
            .join('')
        : '';
      const rows = Math.max(names.length, (ifWon || now).length);

      const cell = (c) =>
        c
          ? `<span class="chest-glyph ${GLYPH[c.chest]}"></span><span>${escapeHtml(CHEST_NAMES[c.pool][c.chest])}</span>`
          : `<span class="nominate-reserve">${escapeHtml(t('nominate.reserve'))}</span>`;

      let html = `<div class="nominate-assign-row nominate-assign-head">
          <span>#</span><span>${escapeHtml(t('nominate.col_player'))}</span><span>${escapeHtml(t(pending ? 'nominate.col_now' : 'nominate.col_chest'))}</span>${pending ? `<span>${escapeHtml(t('nominate.col_if_won'))}</span>` : ''}
        </div>`;
      for (let i = 0; i < rows; i++) {
        const name = names[i];
        html += `<div class="nominate-assign-row${name ? '' : ' is-empty'}">
          <span class="slot-num">${i + 1}.</span>
          <span class="player-ign">${name ? escapeHtml(name) : '—'}</span>
          <span class="nominate-chest">${cell(now[i])}</span>
          ${pending ? `<span class="nominate-chest">${cell(ifWon[i])}</span>` : ''}
        </div>`;
      }
      document.getElementById('assign-list').innerHTML = html;

      const open = now.length;
      const missing = Math.max(0, open - names.length);
      const reserves = Math.max(0, names.length - open);
      document.getElementById('assign-summary').textContent = [
        t('nominate.chests_now', { n: open }),
        pending ? t('nominate.chests_if_won', { n: ifWon.length }) : '',
        t('nominate.named', { n: names.length }),
        missing ? t('nominate.still_need_name', { n: missing }) : '',
        reserves ? tn('nominate.reserves', reserves) : '',
      ]
        .filter(Boolean)
        .join(' · ');

      const dupes = duplicatesInInput();
      const btn = document.getElementById('btn-submit');
      btn.disabled = names.length === 0 || dupes.length > 0;
      btn.textContent = dupes.length ? t('nominate.listed_twice', { name: dupes[0] }) : t('nominate.save');
    }

    input.addEventListener('input', render);

    document.getElementById('nomination-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const status = document.getElementById('save-status');
      btn.disabled = true;
      btn.textContent = t('nominate.saving');
      try {
        const res = await fetch('/api/nominate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, ranked: namesFromInput() }),
        });
        const result = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(result.error || `HTTP ${res.status}`);
        status.className = 'status-banner status-success';
        status.textContent = t('nominate.saved', { when: formatTime(data.period.closesAt) });
      } catch (err) {
        status.className = 'status-banner warning';
        status.textContent = t('nominate.save_failed', { error: err.message });
      }
      status.style.display = 'block';
      render();
    });

    /** A time in the reader's own time zone, with Game Time (UTC-2) alongside. */
    function formatTime(iso) {
      const d = new Date(iso);
      const local = d.toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
      // Game Time is UTC-2 (the "Etc/GMT+2" zone); the day name in the reader's language.
      const gt = d.toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: 'Etc/GMT+2' });
      return `${local} (${t('common.game_time', { time: gt })})`;
    }

    function showError(msg) {
      elLoading.style.display = 'none';
      elError.style.display = 'block';
      elError.textContent = msg;
    }

    load();
  })();
</script>
