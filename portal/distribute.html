lang: "en"

<div class="content-pane portal-pane-md">
  <div class="portal-header">
    <h2 class="portal-title">👑 King's Distribution Console</h2>
    <div class="sub-text" id="progress-indicator">Loading nominations...</div>
  </div>

  <!-- This week's reward period: open/closed, and whether to wait for the battle result -->
  <div id="period-banner" class="nomination-alert-banner" style="display: none;"></div>

  <!-- Shown automatically when an alliance has an active Wartime Buyout this week -->
  <div id="buyout-status-banner" class="nomination-alert-banner buyout-active" style="display: none;"></div>

  <div class="distribute-toolbar">
    <div class="segmented-control">
      <button type="button" class="toggle-btn active" id="btn-group-chest">By Chest</button>
      <button type="button" class="toggle-btn" id="btn-group-alliance">By Alliance</button>
    </div>

    <button type="button" class="draft-btn btn-reset-checklist" id="btn-reset-progress">
      Reset Checklist
    </button>
  </div>

  <div id="roster-container"></div>
</div>

<script>
  (function () {
    let currentStorageKey = 'la_sent_recipients_default';
    let nominationsData = {};
    let wartimeBuyouts = [];
    let groupBy = 'chest';
    let period = null;

    const elRoster = document.getElementById('roster-container');
    const elProgress = document.getElementById('progress-indicator');
    const elBuyoutBanner = document.getElementById('buyout-status-banner');
    const btnGroupChest = document.getElementById('btn-group-chest');
    const btnGroupAlliance = document.getElementById('btn-group-alliance');
    const btnReset = document.getElementById('btn-reset-progress');

    function getSentSet() {
      try {
        return new Set(JSON.parse(localStorage.getItem(currentStorageKey) || '[]'));
      } catch (e) {
        return new Set();
      }
    }

    function saveSentSet(set) {
      localStorage.setItem(currentStorageKey, JSON.stringify(Array.from(set)));
    }

    async function loadNominations() {
      try {
        const res = await fetch(`/api/nominate?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data && data.nominations) {
          nominationsData = data.nominations;
          wartimeBuyouts = data.wartime_buyouts || [];
          period = data.period || null;
          if (data.lastReset) {
            const cycleHash = btoa(data.lastReset).replace(/[^a-zA-Z0-9]/g, '').slice(0, 16);
            currentStorageKey = `la_sent_recipients_${cycleHash}`;
          }
        } else {
          nominationsData = data || {};
          const headerCycle = res.headers.get('x-cycle-id');
          if (headerCycle) {
            currentStorageKey = `la_sent_recipients_${headerCycle}`;
          }
        }

        render();
      } catch (err) {
        elRoster.innerHTML = `<div class="status-banner warning">
          Failed to load nominations: ${err.message}
        </div>`;
      }
    }

    // The period (api/_reward_period.js). In a Kingdom War week the King waits for the battle
    // result before handing out: a win re-sorts every list, and chests given can't be moved.
    function renderPeriodBanner() {
      const el = document.getElementById('period-banner');
      if (!el || !period) return;
      const until = new Date(period.closesAt).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
      let text;
      if (!period.open) {
        text = '🔒 Rewards are closed. The lists below are from the last week; the next rewards open Friday at about 20:00 GT.';
      } else if (period.kwWeek && period.result === 'pending') {
        text = `⏳ <strong>Hold the chests:</strong> wait for Saturday's battle result before handing out. If the war is won, King of Battle Reward chests open and every list is re-sorted. Rewards close ${until}.`;
      } else if (period.result === 'won') {
        text = `⚔️ <strong>Kingdom War won:</strong> hand out both sets. Rewards close ${until} (Wednesday 00:00 GT).`;
      } else {
        text = `🎁 <strong>${period.weekName} rewards:</strong> hand out the King's Commendation. Rewards close ${until} (Wednesday 00:00 GT).`;
      }
      el.innerHTML = `<span>${text}</span>`; // one block, so the bold words stay inline
      el.style.display = 'flex';
    }

    function renderBuyoutBanner() {
      if (!elBuyoutBanner) return;

      const buyoutAlliances = Object.values(nominationsData).filter(a => a && a.hasBuyoutBonus);
      if (buyoutAlliances.length > 0) {
        const tags = buyoutAlliances.map(a => `<strong>[${escapeHtml(a.alliance)}]</strong>`).join(', ');
        elBuyoutBanner.innerHTML = `
          <span>🛡️</span>
          <div>
            <strong>Wartime Restitution Active:</strong> ${tags} ${buyoutAlliances.length === 1 ? 'includes' : 'include'} bonus Commander's Will slots funded from WLO's Rank #1 allotment.
          </div>
        `;
        elBuyoutBanner.style.display = 'flex';
      } else {
        elBuyoutBanner.style.display = 'none';
        elBuyoutBanner.innerHTML = '';
      }
    }

    function render() {
      const sentSet = getSentSet();
      const alliances = Object.keys(nominationsData);

      renderPeriodBanner();
      renderBuyoutBanner();

      if (alliances.length === 0) {
        elRoster.innerHTML = '<div class="sub-text distribute-empty">No nominations submitted yet.</div>';
        elProgress.textContent = '0 Recipient Entries';
        return;
      }

      const flatList = [];

      alliances.forEach(tag => {
        const item = nominationsData[tag];
        const rec = item.recipients || {};
        const hasBuyout = Boolean(item.hasBuyoutBonus);

        const addEntries = (poolData, poolName) => {
          if (!poolData) return;
          const cwList = poolData.commanders_will || [];
          cwList.forEach((ign, idx) => {
            // The final gold slot in a buyout beneficiary's list is the restitution chest
            const isBuyout = hasBuyout && idx === cwList.length - 1;
            flatList.push({ ign, type: 'commanders_will', alliance: tag, pool: poolName, isBuyout });
          });
          (poolData.loyal_servant || []).forEach(ign =>
            flatList.push({ ign, type: 'loyal_servant', alliance: tag, pool: poolName, isBuyout: false })
          );
          (poolData.followers_heart || []).forEach(ign =>
            flatList.push({ ign, type: 'followers_heart', alliance: tag, pool: poolName, isBuyout: false })
          );
        };

        if (rec.standard) {
          addEntries(rec.standard, 'REG');
          if (rec.kingdom_war) {
            addEntries(rec.kingdom_war, 'KW');
          }
        } else {
          addEntries(rec, 'REG');
        }
      });

      const sentCount = flatList.filter(e => sentSet.has(`${e.alliance}:${e.pool}:${e.type}:${e.ign}`)).length;
      elProgress.textContent = `Progress: ${sentCount} / ${flatList.length} Distributed`;

      let html = '';

      if (groupBy === 'chest') {
        // One set at a time, like the game's two tabs: all of King's Commendation (REG),
        // then all of King of Battle Reward (KW); within a set, most valuable first.
        const tiers = [
          { pool: 'REG', key: 'commanders_will', title: '🟡 Commander\'s Will', glyph: 'gold' },
          { pool: 'REG', key: 'loyal_servant', title: '🟣 Loyal Servant', glyph: 'purple' },
          { pool: 'REG', key: 'followers_heart', title: '🔵 Follower\'s Heart', glyph: 'blue' },
          { pool: 'KW', key: 'commanders_will', title: '🟡 Honor Vanguard', glyph: 'gold' },
          { pool: 'KW', key: 'loyal_servant', title: '🟣 Fearless Hero', glyph: 'purple' },
          { pool: 'KW', key: 'followers_heart', title: '🔵 Logistics Support', glyph: 'blue' }
        ];
        const SET_NAMES = { REG: '👑 King\'s Commendation', KW: '⚔️ King of Battle Reward' };

        let currentSet = null;
        tiers.forEach(tier => {
          const matched = flatList.filter(e => e.type === tier.key && e.pool === tier.pool);
          if (matched.length === 0) return;

          matched.sort((a, b) => {
            const rankA = nominationsData[a.alliance]?.rank ?? 99;
            const rankB = nominationsData[b.alliance]?.rank ?? 99;
            if (rankA !== rankB) return rankA - rankB;
            if (a.alliance !== b.alliance) return a.alliance.localeCompare(b.alliance);

            return a.ign.localeCompare(b.ign);
          });

          if (tier.pool !== currentSet) {
            currentSet = tier.pool;
            const setCount = flatList.filter(e => e.pool === tier.pool).length;
            html += `<div class="distribute-set-heading">${SET_NAMES[tier.pool]} (${setCount})</div>`;
          }
          html += `<div class="slot-group-title distribute-group-heading">${tier.title} (${matched.length})</div>`;
          matched.forEach(item => {
            html += renderRow(item, tier.glyph, sentSet);
          });
        });
      } else {
        alliances.sort((a, b) => (nominationsData[a].rank || 99) - (nominationsData[b].rank || 99));

        alliances.forEach(tag => {
          const matched = flatList.filter(e => e.alliance === tag);
          if (matched.length === 0) return;

          matched.sort((a, b) => {
            const poolOrder = { REG: 1, KW: 2 };
            const poolDiff = (poolOrder[a.pool] || 1) - (poolOrder[b.pool] || 1);
            if (poolDiff !== 0) return poolDiff;

            const tierOrder = { commanders_will: 1, loyal_servant: 2, followers_heart: 3 };
            return (tierOrder[a.type] || 99) - (tierOrder[b.type] || 99);
          });

          html += `<div class="slot-group-title distribute-group-heading">[${tag}] • Rank ${nominationsData[tag].rank || '-'} (${matched.length})</div>`;
          matched.forEach(item => {
            const glyph = item.type === 'commanders_will' ? 'gold' : item.type === 'loyal_servant' ? 'purple' : 'blue';
            html += renderRow(item, glyph, sentSet);
          });
        });
      }

      elRoster.innerHTML = html;
      bindEvents();
    }

    function renderRow(item, glyph, sentSet) {
      const id = `${item.alliance}:${item.pool}:${item.type}:${item.ign}`;
      const isSent = sentSet.has(id);
      const isKW = item.pool === 'KW';

      return `
        <div class="distribute-item ${isSent ? 'sent' : ''} ${item.isBuyout ? 'is-buyout' : ''}" data-id="${escapeHtml(id)}">
          <span class="chest-glyph ${glyph}"></span>
          <span class="badge badge-alliance-sm">${escapeHtml(item.alliance)}</span>
          <span class="badge ${isKW ? 'badge-pool-kw' : 'badge-pool-reg'}">
            ${item.pool}
          </span>
          ${item.isBuyout ? '<span class="badge badge-buyout">BUYOUT</span>' : ''}
          <span class="player-ign">${escapeHtml(item.ign)}</span>
          <button type="button" class="copy-btn" data-copy="${escapeHtml(item.ign)}">Copy</button>
        </div>
      `;
    }

    function bindEvents() {
      elRoster.querySelectorAll('.distribute-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('copy-btn')) return;
          const id = el.getAttribute('data-id');
          const sentSet = getSentSet();

          if (sentSet.has(id)) {
            sentSet.delete(id);
            el.classList.remove('sent');
          } else {
            sentSet.add(id);
            el.classList.add('sent');
          }
          saveSentSet(sentSet);
          updateProgressOnly();
        });
      });

      elRoster.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const text = btn.getAttribute('data-copy');
          try {
            await navigator.clipboard.writeText(text);
            btn.textContent = '✓ Copied';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = 'Copy';
              btn.classList.remove('copied');
            }, 1200);
          } catch (err) {
            prompt('Copy recipient name:', text);
          }
        });
      });
    }

    function updateProgressOnly() {
      const sentSet = getSentSet();
      const total = elRoster.querySelectorAll('.distribute-item').length;
      elProgress.textContent = `Progress: ${sentSet.size} / ${total} Distributed`;
    }

    // escapeHtml() is the shared helper from /js/escape-html.js (loaded in <head>).

    btnGroupChest.addEventListener('click', () => {
      groupBy = 'chest';
      btnGroupChest.classList.add('active');
      btnGroupAlliance.classList.remove('active');
      render();
    });

    btnGroupAlliance.addEventListener('click', () => {
      groupBy = 'alliance';
      btnGroupAlliance.classList.add('active');
      btnGroupChest.classList.remove('active');
      render();
    });

    btnReset.addEventListener('click', () => {
      if (confirm('Reset all sent statuses back to uncompleted for this cycle?')) {
        localStorage.removeItem(currentStorageKey);
        render();
      }
    });

    loadNominations();
  })();
</script>
