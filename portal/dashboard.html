---
layout: portal
title: Alliance Dashboard
permalink: /dashboard.html
lang: "en"
---

<div class="content-pane portal-pane-md" id="dashboard-app">
  <div class="portal-header">
    <div class="alliance-badge-lg" id="dash-alliance">Alliance Dashboard</div>
    <div class="sub-text" id="dash-subtitle">Loading your alliance dashboard…</div>
    <!-- Stewards: look at (and help with) any alliance's dashboard -->
    <label class="dash-switcher" id="dash-switcher" hidden>
      <span>View as</span>
      <select id="dash-switcher-select"></select>
    </label>
  </div>

  <div id="dash-message" class="status-banner" hidden></div>

  <!-- R4/R5, officers and Stewards only (the server sends it only to them) -->
  <section class="dash-card dash-rewards" id="dash-rewards" hidden aria-labelledby="dash-rewards-title">
    <h3 class="dash-card-title" id="dash-rewards-title">🔒 Weekly Rewards <span class="dash-tag">Officers</span></h3>
    <div id="dash-rewards-body"></div>
  </section>

  <!-- Caravan Rotor: run by leaders; members see it read-only when leaders allow -->
  <section class="dash-card dash-caravan" id="dash-caravan" hidden aria-labelledby="dash-caravan-title"></section>

  <!-- Leaders: edit mode (add, edit, move, delete charts and tables) -->
  <div class="dash-edit-bar" id="dash-edit-bar" hidden>
    <button type="button" class="dash-btn" id="dash-edit-toggle" aria-pressed="false">✏️ Edit Dashboard</button>
    <button type="button" class="dash-btn" id="dash-add" hidden>➕ Add a chart or table</button>
  </div>
  <section class="dash-card dash-editor" id="dash-editor" hidden aria-label="Chart or table editor"></section>

  <section class="dash-widgets" id="dash-widgets" hidden aria-label="Alliance charts and tables"></section>
</div>

<script src="/js/dashboard-widgets.js"></script>
<script>
  (function () {
    // escapeHtml() is the shared helper from /js/escape-html.js (loaded in <head>).
    const $ = (id) => document.getElementById(id);
    const CHESTS = {
      standard: { commanders_will: "Commander's Will", loyal_servant: 'Loyal Servant', followers_heart: "Follower's Heart" },
      kingdom_war: { commanders_will: 'Honor Vanguard', loyal_servant: 'Fearless Hero', followers_heart: 'Logistics Support' },
    };
    let data = null;
    let countdownTimer = null;

    function loginPass() {
      try {
        return localStorage.getItem('auth-session') || '';
      } catch (e) {
        return '';
      }
    }

    function message(html, kind) {
      const el = $('dash-message');
      el.className = `status-banner${kind ? ` ${kind}` : ''}`;
      el.innerHTML = html;
      el.hidden = false;
    }

    async function load(alliance) {
      const pass = loginPass();
      if (!pass) {
        $('dash-subtitle').textContent = '';
        message(
          '🔐 <strong>Sign in to see your alliance dashboard.</strong><br>Use <strong>Sign In</strong> at the top right (Discord). Your alliance is found from your NAP server role.' +
            '<br><br><button type="button" class="submit-plan-btn" id="dash-signin">Sign in with Discord</button>',
        );
        $('dash-signin')?.addEventListener('click', () => window.triggerDiscordLogin?.());
        return;
      }
      try {
        const res = await fetch(`/api/dashboard${alliance ? `?alliance=${encodeURIComponent(alliance)}` : ''}`, {
          headers: { Authorization: `Bearer ${pass}` },
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          $('dash-subtitle').textContent = '';
          if (body.code === 'login') {
            message(`🔐 ${escapeHtml(body.error)}<br><br><button type="button" class="submit-plan-btn" id="dash-signin">Sign in again</button>`, 'warning');
            $('dash-signin')?.addEventListener('click', () => window.triggerDiscordLogin?.());
          } else {
            message(`⚠️ ${escapeHtml(body.error || `HTTP ${res.status}`)}`, 'warning');
          }
          return;
        }
        data = body;
        $('dash-message').hidden = true;
        render();
      } catch (err) {
        message(`⚠️ Couldn't load the dashboard. Check your connection and refresh. (${escapeHtml(err.message)})`, 'warning');
      }
    }

    function render() {
      const a = data.alliance;
      const badge = $('dash-alliance');
      badge.textContent = `[${a.tag}]`;
      if (a.color && /^#[0-9a-f]{6}$/i.test(a.color)) badge.style.color = a.color;
      const who = { steward: 'Steward view', leader: 'Leadership view', member: 'Member view' }[data.viewer.tier];
      $('dash-subtitle').textContent = `Alliance Dashboard${a.rank ? ` · Rank #${a.rank}` : ''} · ${who}`;
      document.title = `[${a.tag}] Alliance Dashboard | Last Asylum`;

      // Stewards: alliance switcher
      if (Array.isArray(data.alliances) && data.alliances.length) {
        const select = $('dash-switcher-select');
        select.innerHTML = data.alliances
          .map((x) => `<option value="${escapeHtml(x.tag)}"${x.tag === a.tag ? ' selected' : ''}>[${escapeHtml(x.tag)}]${x.rank ? ` · #${x.rank}` : ''}</option>`)
          .join('');
        $('dash-switcher').hidden = false;
      }

      renderRewards();
      renderCaravan();
      renderWidgets();
    }

    /** Chests as coloured icons with counts (names in the tooltip): gold, purple, blue. */
    function chestIcons(counts, pool) {
      const c = (counts && counts[pool]) || {};
      const names = Object.keys(CHESTS[pool]).map((k) => `${CHESTS[pool][k]} ×${Number(c[k] || 0)}`).join(', ');
      return `<span class="dash-chests" title="${escapeHtml(names)}" aria-label="${escapeHtml(names)}">${[
        ['commanders_will', 'gold'],
        ['loyal_servant', 'purple'],
        ['followers_heart', 'blue'],
      ]
        .map(([k, glyph]) => `<span class="dash-chest"><span class="chest-glyph ${glyph}"></span>${Number(c[k] || 0)}</span>`)
        .join('')}</span>`;
    }

    function when(iso) {
      const d = new Date(iso);
      const local = d.toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
      const gt = new Date(d.getTime() - 2 * 3600000);
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      return `${local} (${days[gt.getUTCDay()]} ${String(gt.getUTCHours()).padStart(2, '0')}:${String(gt.getUTCMinutes()).padStart(2, '0')} GT)`;
    }

    function countdown(iso) {
      const ms = new Date(iso).getTime() - Date.now();
      if (ms <= 0) return 'now';
      const d = Math.floor(ms / 864e5);
      const h = Math.floor((ms % 864e5) / 36e5);
      const m = Math.floor((ms % 36e5) / 6e4);
      return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
    }

    function renderRewards() {
      const r = data.rewards;
      $('dash-rewards').hidden = !r;
      if (!r) return;
      const p = r.period;
      const n = r.nomination;

      // 1. Period and Kingdom War result
      const status = p.open
        ? `<span title="Closes ${escapeHtml(when(p.closesAt))}">🟢 <strong>Open</strong> · <span data-countdown="${escapeHtml(p.closesAt)}">${countdown(p.closesAt)}</span> left</span>`
        : `<span title="Opens ${escapeHtml(when(p.nextOpensAt))}, after Friday's capitol event">⚪ <strong>Closed</strong> · opens in <span data-countdown="${escapeHtml(p.nextOpensAt)}">${countdown(p.nextOpensAt)}</span></span>`;
      const war = !p.kwWeek
        ? '<span class="dash-pill">Off-Week</span>'
        : p.result === 'won'
          ? '<span class="dash-pill is-good">🏆 KW won</span>'
          : p.result === 'lost'
            ? '<span class="dash-pill">🛡️ KW lost</span>'
            : '<span class="dash-pill is-wait">⏳ KW pending</span>';

      // 2. Chests: set 1 always; set 2 when won, greyed "if won" while pending
      let set2 = '';
      if (p.kwWeek && p.result === 'won') set2 = `<span class="dash-set" title="King of Battle Reward">⚔️ ${chestIcons(r.chests, 'kingdom_war')}</span>`;
      else if (p.kwWeek && p.result !== 'lost') set2 = `<span class="dash-set is-maybe" title="King of Battle Reward, if the war is won">⚔️ ${chestIcons(r.chestsIfWon, 'kingdom_war')}<small>if won</small></span>`;
      const chests = r.rank
        ? `<span class="dash-set" title="King's Commendation">👑 ${chestIcons(r.chests, 'standard')}</span>${set2}`
        : '<span class="dash-warn">No rank in the standings: no chests</span>';

      // 3. The list
      const list = n.submitted
        ? `<span title="${n.submittedAt ? `Sent ${escapeHtml(when(n.submittedAt))}` : ''}">✅ List sent · ${n.ranked}${n.reserves ? ` <span class="dash-muted">(${n.reserves} reserve${n.reserves === 1 ? '' : 's'})</span>` : ''}${n.unfilled ? ` · <span class="dash-warn">${n.unfilled} empty</span>` : ''}</span>`
        : p.open
          ? '<span class="dash-warn">⚠️ List not sent</span>'
          : '<span class="dash-muted">No list while closed</span>';
      let action = '';
      if (p.open && data.viewer.canNominate) {
        action = `<button type="button" class="dash-btn" id="dash-nominate">📝 ${n.submitted ? 'Edit' : 'Send list'}</button>`;
      } else if (p.open) {
        action = '<span class="dash-muted dash-small" title="Your R5 can open the nomination page from here, or run /nominate in Discord.">R5 or /nominate</span>';
      }

      // 4. Buyout, only when it applies
      const buyout = r.hasBuyoutBonus
        ? `<div class="dash-line dash-small" title="Funded by WLO${r.buyoutThreat ? ` · threat: ${escapeHtml(r.buyoutThreat)}` : ''}"><span>🛡️ Buyout: <strong>+1</strong> <span class="chest-glyph gold"></span> in each set won</span></div>`
        : r.isWloDeducted
          ? '<div class="dash-line dash-small" title="Funding the displaced alliance this week"><span>⚖️ Buyout: <strong>−1</strong> <span class="chest-glyph gold"></span> in each set</span></div>'
          : '';

      $('dash-rewards-body').innerHTML =
        `<div class="dash-line">${status}${war}</div>` +
        `<div class="dash-line dash-chest-row">${chests}</div>` +
        `<div class="dash-line">${list}${action}</div>` +
        buyout +
        '<div class="dash-warn dash-small" id="dash-nominate-error"></div>';

      $('dash-nominate')?.addEventListener('click', openNomination);
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        document.querySelectorAll('[data-countdown]').forEach((el) => {
          el.textContent = countdown(el.getAttribute('data-countdown'));
        });
      }, 30000);
    }

    async function openNomination(e) {
      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        const res = await fetch('/api/dashboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${loginPass()}` },
          body: JSON.stringify({ action: 'nominate-link', alliance: data.alliance.tag }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
        window.location.href = body.url;
      } catch (err) {
        btn.disabled = false;
        $('dash-nominate-error').textContent = err.message;
      }
    }

    // ---------- Caravan Rotor ----------
    // Times are Game Time (UTC-2) and shown with the reader's own time beside them.
    let caravanFilter = { text: '', now: false };
    let caravanEditing = null; // id of the row being edited

    const gtToLocal = (hhmm) => {
      const [h, m] = hhmm.split(':').map(Number);
      const d = new Date();
      const at = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), h + 2, m));
      return at.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    };
    const nowGtMinutes = () => {
      const d = new Date();
      return (((d.getUTCHours() - 2) * 60 + d.getUTCMinutes()) % 1440 + 1440) % 1440;
    };
    const minutes = (hhmm) => {
      const [h, m] = hhmm.split(':').map(Number);
      return h * 60 + m;
    };
    function windowText(p) {
      if (!p.from) return '<span class="dash-muted">flexible</span>';
      const gt = p.to ? `${p.from}–${p.to}` : p.from;
      const local = p.to ? `${gtToLocal(p.from)}–${gtToLocal(p.to)}` : gtToLocal(p.from);
      return `${gt} GT <span class="dash-muted">(${escapeHtml(local)} your time)</span>`;
    }
    /** Available around now: inside their window (or within an hour of a single time); flexible players always. */
    function aroundNow(p) {
      if (!p.from) return true;
      const n = nowGtMinutes();
      const f = minutes(p.from);
      if (!p.to) return Math.min(Math.abs(n - f), 1440 - Math.abs(n - f)) <= 60;
      const t = minutes(p.to);
      return f <= t ? n >= f && n <= t : n >= f || n <= t; // a window past midnight
    }

    function renderCaravan() {
      const el = $('dash-caravan');
      const c = data.dashboard && data.dashboard.caravan;
      const leader = isLeader();
      el.hidden = !c;
      if (!c) return;
      const all = c.roster || [];
      const picked = all.filter((p) => p.picked);
      const q = caravanFilter.text.trim().toLowerCase();
      const available = all
        .filter((p) => !p.picked)
        .filter((p) => (!q || p.name.toLowerCase().includes(q)) && (!caravanFilter.now || aroundNow(p)));
      const now = nowGtMinutes();
      const nowText = `${String(Math.floor(now / 60)).padStart(2, '0')}:${String(now % 60).padStart(2, '0')} GT`;

      const row = (p) => {
        if (leader && caravanEditing === p.id) {
          return `<li class="dash-cv-row is-editing" data-id="${escapeHtml(p.id)}">
            <input type="text" class="cv-name" maxlength="40" value="${escapeHtml(p.name)}" aria-label="Name">
            <input type="text" class="cv-from" value="${escapeHtml(p.from || '')}" placeholder="18:00" aria-label="From (Game Time)">
            <input type="text" class="cv-to" value="${escapeHtml(p.to || '')}" placeholder="22:00" aria-label="To (Game Time)">
            <button type="button" class="dash-icon-btn" data-cv="save-edit">💾</button>
            <button type="button" class="dash-icon-btn" data-cv="cancel-edit">✕</button>
          </li>`;
        }
        const tools = leader
          ? p.picked
            ? '<button type="button" class="dash-icon-btn" data-cv="unpick" title="Back to available">Undo</button>'
            : `<button type="button" class="dash-btn" data-cv="pick">✓ Picked</button>
               <button type="button" class="dash-icon-btn" data-cv="edit" title="Edit" aria-label="Edit">✏️</button>
               <button type="button" class="dash-icon-btn" data-cv="remove" title="Remove" aria-label="Remove">🗑️</button>`
          : '';
        const pickedText = p.picked
          ? `<span class="dash-muted">✓ ${new Date(p.picked.at).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' })}${p.picked.by ? ` · ${escapeHtml(p.picked.by)}` : ''}</span>`
          : windowText(p);
        return `<li class="dash-cv-row${p.picked ? ' is-picked' : ''}" data-id="${escapeHtml(p.id)}">
          <span class="dash-cv-name">${escapeHtml(p.name)}</span>
          <span class="dash-cv-when">${pickedText}</span>
          <span class="dash-cv-tools">${tools}</span>
        </li>`;
      };

      el.innerHTML = `
        <h3 class="dash-card-title" id="dash-caravan-title">🐪 Caravan Rotor <span class="dash-tag">${picked.length}/${all.length} picked</span></h3>
        ${leader ? `<div class="dash-cv-bar">
          <label class="dash-check"><input type="checkbox" id="cv-members"${c.membersCanView ? ' checked' : ''}> 👥 Members can view</label>
          <span class="dash-cv-actions">
            <button type="button" class="dash-icon-btn" data-cv="copy">📋 Copy status</button>
            <button type="button" class="dash-icon-btn" data-cv="new-week">🔄 New week</button>
          </span>
        </div>` : `<div class="dash-cv-bar"><span class="dash-muted dash-small">Picked by your R4s when a caravan is ready.</span><button type="button" class="dash-icon-btn" data-cv="copy">📋 Copy status</button></div>`}
        <div class="dash-cv-filters">
          <input type="search" id="cv-search" placeholder="Search names…" value="${escapeHtml(caravanFilter.text)}" aria-label="Search names">
          <button type="button" class="dash-icon-btn" data-cv="now" aria-pressed="${caravanFilter.now}" title="Only players available around now">⏰ Around now <small>${nowText}</small></button>
        </div>
        <div class="dash-cv-head">Available this week (${all.length - picked.length})</div>
        <ul class="dash-cv-list">${available.map(row).join('') || `<li class="dash-cv-empty">${all.length - picked.length ? 'Nobody matches.' : all.length ? 'Everyone has had a caravan this week. 🎉' : leader ? 'Add players below.' : 'No players yet.'}</li>`}</ul>
        ${picked.length ? `<details class="dash-cv-picked"${leader ? '' : ' open'}><summary>Picked this week (${picked.length})</summary><ul class="dash-cv-list">${picked.map(row).join('')}</ul></details>` : ''}
        ${leader ? `<form class="dash-cv-add" id="cv-add">
          <input type="text" id="cv-add-name" maxlength="40" placeholder="Player name" aria-label="Player name">
          <input type="text" id="cv-add-from" placeholder="From 18:00" aria-label="Available from (Game Time, optional)">
          <input type="text" id="cv-add-to" placeholder="To 22:00" aria-label="Available until (Game Time, optional)">
          <button type="submit" class="dash-btn">➕ Add</button>
        </form>
        <div class="dash-muted dash-small">Times are Game Time (UTC-2) and optional; leave them empty for players who are flexible.</div>
        <div class="dash-error" id="cv-error"></div>` : ''}`;
      const search = $('cv-search');
      search.addEventListener('input', () => {
        caravanFilter.text = search.value;
        const pos = search.selectionStart;
        renderCaravan();
        const again = $('cv-search');
        again.focus();
        again.setSelectionRange(pos, pos);
      });
      $('cv-members')?.addEventListener('change', (e) => caravanChange({ action: 'caravan-visibility', membersCanView: e.target.checked }));
      $('cv-add')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const ok = await caravanChange({ action: 'caravan-add', name: $('cv-add-name').value, from: $('cv-add-from').value, to: $('cv-add-to').value });
        if (ok) $('cv-add-name')?.focus();
      });
    }

    async function caravanChange(change) {
      const error = await save(change, { quiet: true });
      if (error) {
        const box = $('cv-error');
        if (box) box.textContent = error;
        else alert(`Not saved: ${error}`);
        return false;
      }
      return true;
    }

    function caravanStatusText() {
      const c = data.dashboard.caravan;
      const left = c.roster.filter((p) => !p.picked);
      const done = c.roster.filter((p) => p.picked);
      const when = (p) => (p.from ? ` (${p.to ? `${p.from}–${p.to}` : p.from} GT)` : '');
      return [
        `🐪 [${data.alliance.tag}] Caravan Rotor: ${done.length}/${c.roster.length} picked`,
        `Available: ${left.map((p) => p.name + when(p)).join(', ') || 'nobody'}`,
        `Picked: ${done.map((p) => p.name).join(', ') || 'nobody yet'}`,
      ].join('\n');
    }

    $('dash-caravan').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-cv]');
      if (!b) return;
      const act = b.dataset.cv;
      const id = b.closest('[data-id]')?.dataset.id;
      if (act === 'now') {
        caravanFilter.now = !caravanFilter.now;
        return renderCaravan();
      }
      if (act === 'copy') {
        const text = caravanStatusText();
        try {
          await navigator.clipboard.writeText(text);
          b.textContent = '✓ Copied';
          setTimeout(() => renderCaravan(), 1200);
        } catch (err) {
          prompt('Copy the rotor status:', text);
        }
        return;
      }
      if (act === 'edit') {
        caravanEditing = id;
        return renderCaravan();
      }
      if (act === 'cancel-edit') {
        caravanEditing = null;
        return renderCaravan();
      }
      if (act === 'save-edit') {
        const li = b.closest('li');
        const ok = await caravanChange({ action: 'caravan-edit', id, name: li.querySelector('.cv-name').value, from: li.querySelector('.cv-from').value, to: li.querySelector('.cv-to').value });
        if (ok) {
          caravanEditing = null;
          renderCaravan();
        }
        return;
      }
      if (act === 'remove') {
        const p = data.dashboard.caravan.roster.find((x) => x.id === id);
        if (!confirm(`Remove ${p ? p.name : 'this player'} from the rotor?`)) return;
        return caravanChange({ action: 'caravan-remove', id });
      }
      if (act === 'new-week') {
        if (!confirm('Start a new week? Everyone goes back to available (the names and times stay).')) return;
        return caravanChange({ action: 'caravan-new-week' });
      }
      b.disabled = true;
      return caravanChange({ action: act === 'pick' ? 'caravan-pick' : 'caravan-unpick', id });
    });

    // ---------- Charts and tables ----------
    const W = window.DashboardWidgets;
    const TYPES = [
      ['bar', '📊 Bar'],
      ['line', '📈 Line'],
      ['pie', '🍩 Pie'],
      ['progress', '🎯 Progress'],
      ['table', '📋 Table'],
    ];
    let editing = false;

    function isLeader() {
      return data && data.viewer.tier !== 'member';
    }

    function widgetCard(w, i, count) {
      const vis = w.visibility === 'members' ? '👥 All members' : '🔒 Officers only';
      const linked = w.source && (w.source.kind === 'sheet' || w.source.kind === 'doc');
      const day = (iso) => new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      const updated = linked
        ? `🔗 ${w.source.kind === 'doc' ? 'Google Doc' : 'Google Sheet'}${w.syncedAt ? ` · synced ${day(w.syncedAt)}` : ''}`
        : w.updatedAt
          ? `Updated ${new Date(w.updatedAt).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}`
          : '';
      const sync = linked && isLeader() ? '<button type="button" class="dash-sync" data-act="sync" title="Fetch the latest numbers from the sheet">🔄 Sync now</button>' : '';
      const tools = editing
        ? `<div class="dash-widget-tools">
            <button type="button" class="dash-icon-btn" data-act="up" ${i === 0 ? 'disabled' : ''} title="Move up" aria-label="Move up">▲</button>
            <button type="button" class="dash-icon-btn" data-act="down" ${i === count - 1 ? 'disabled' : ''} title="Move down" aria-label="Move down">▼</button>
            <button type="button" class="dash-icon-btn" data-act="edit" title="Edit" aria-label="Edit">✏️</button>
            <button type="button" class="dash-icon-btn" data-act="delete" title="Delete" aria-label="Delete">🗑️</button>
          </div>`
        : '';
      return `<article class="dash-card dash-widget" data-id="${escapeHtml(w.id)}">
        <div class="dash-widget-head"><h3 class="dash-card-title">${escapeHtml(w.title)}</h3>${tools}</div>
        <div class="dash-widget-meta">${isLeader() ? `<span>${vis}</span>` : ''}${updated ? `<span>${updated}</span>` : ''}${sync}</div>
        ${w.note ? `<p class="dash-widget-note">${escapeHtml(w.note)}</p>` : ''}
        <div class="dash-widget-body">${W.render(w)}</div>
      </article>`;
    }

    function renderWidgets() {
      const list = (data.dashboard && data.dashboard.widgets) || [];
      const el = $('dash-widgets');
      el.hidden = false;
      $('dash-edit-bar').hidden = !isLeader();
      $('dash-edit-toggle').setAttribute('aria-pressed', String(editing));
      $('dash-edit-toggle').textContent = editing ? '✓ Done editing' : '✏️ Edit Dashboard';
      $('dash-add').hidden = !editing;
      if (!list.length) {
        el.innerHTML = `<div class="dash-card dash-empty">${
          !isLeader()
            ? "📊 Your alliance's leaders haven't shared any charts or tables here yet."
            : editing
              ? '📊 No charts or tables yet: use “Add a chart or table”.'
              : '📊 No charts or tables yet. Use “Edit Dashboard” to add one.'
        }</div>`;
        return;
      }
      el.innerHTML = list.map((w, i) => widgetCard(w, i, list.length)).join('');
      el.querySelectorAll('.dash-widget').forEach((card) => {
        const w = list.find((x) => x.id === card.dataset.id);
        W.mount(card.querySelector('.dash-widget-body'), w);
      });
    }

    $('dash-edit-toggle').addEventListener('click', () => {
      editing = !editing;
      if (!editing) closeEditor();
      renderWidgets();
    });
    $('dash-add').addEventListener('click', () => openEditor(null));
    $('dash-widgets').addEventListener('click', async (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const id = b.closest('.dash-widget').dataset.id;
      const act = b.dataset.act;
      if (act === 'edit') return openEditor(data.dashboard.widgets.find((w) => w.id === id));
      if (act === 'sync') {
        b.disabled = true;
        b.textContent = '🔄 Syncing…';
        const error = await save({ action: 'sync-widget', id });
        if (error && document.body.contains(b)) {
          b.disabled = false;
          b.textContent = '🔄 Sync now';
        }
        return;
      }
      if (act === 'delete') {
        const w = data.dashboard.widgets.find((x) => x.id === id);
        if (!confirm(`Delete "${w ? w.title : 'this chart'}"? This can't be undone.`)) return;
        return save({ action: 'delete-widget', id });
      }
      return save({ action: 'move-widget', id, by: act === 'up' ? -1 : 1 });
    });

    /** Sends a change; on success shows the dashboard as saved. Returns the error text or ''. */
    async function save(change, { quiet = false } = {}) {
      try {
        const res = await fetch('/api/dashboard', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${loginPass()}` },
          body: JSON.stringify({ ...change, alliance: data.alliance.tag }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
        data.dashboard = body.dashboard;
        renderCaravan();
        renderWidgets();
        return '';
      } catch (err) {
        if (!change.widget && !quiet) alert(`Not saved: ${err.message}`);
        return err.message;
      }
    }

    // ---------- The editor ----------
    function closeEditor() {
      $('dash-editor').hidden = true;
      $('dash-editor').innerHTML = '';
    }

    function openEditor(existing) {
      const w = existing
        ? JSON.parse(JSON.stringify(existing))
        : { type: 'bar', title: '', note: '', visibility: 'r4_only', data: { columns: [], rows: [] }, options: {} };
      const ed = $('dash-editor');
      ed.hidden = false;
      ed.innerHTML = `
        <h3 class="dash-card-title">${existing ? '✏️ Edit chart or table' : '➕ New chart or table'}</h3>
        <label>Type</label>
        <div class="dash-types" id="ed-types" role="group" aria-label="Type">${TYPES.map(([t, name]) => `<button type="button" data-type="${t}" aria-pressed="${w.type === t}">${name}</button>`).join('')}</div>
        <label for="ed-title">Title</label>
        <input type="text" id="ed-title" maxlength="80" value="${escapeHtml(w.title)}" placeholder="e.g. Alliance Duel scores">
        <label for="ed-note">Explanation <span class="dash-muted">(optional)</span></label>
        <textarea id="ed-note" rows="2" maxlength="400" placeholder="e.g. Minimum 15M Duel points required by Friday reset">${escapeHtml(w.note)}</textarea>
        <label for="ed-vis">Who can see it</label>
        <select id="ed-vis">
          <option value="r4_only"${w.visibility !== 'members' ? ' selected' : ''}>🔒 Officers only (R4/R5)</option>
          <option value="members"${w.visibility === 'members' ? ' selected' : ''}>👥 All alliance members</option>
        </select>
        <label>Data</label>
        <div class="dash-types dash-src" role="group" aria-label="Where the data comes from">
          <button type="button" data-src="paste" aria-pressed="true">📋 Paste a table</button>
          <button type="button" data-src="link" aria-pressed="false">🔗 Google Sheet / Doc link</button>
        </div>
        <div id="ed-src-paste">
          <div class="dash-muted dash-small">Copy the cells from Google Sheets or Excel (header row first) and paste them here.</div>
          <textarea id="ed-paste" class="dash-paste" placeholder="Name&#9;Score&#10;Aria&#9;15200000&#10;Bram&#9;12900000"></textarea>
        </div>
        <div id="ed-src-link" hidden>
          <input type="text" id="ed-url" placeholder="https://docs.google.com/spreadsheets/d/…" value="${escapeHtml((w.source && w.source.url) || '')}">
          <div class="dash-link-opts" id="ed-sheet-opts">
            <input type="text" id="ed-sheet" placeholder="Tab name (optional)" value="${escapeHtml((w.source && w.source.sheet) || '')}">
            <input type="text" id="ed-range" placeholder="Range, e.g. A1:D20 (optional)" value="${escapeHtml((w.source && w.source.range) || '')}">
          </div>
          <div class="dash-link-opts" id="ed-doc-opts" hidden>
            <input type="text" inputmode="numeric" id="ed-table" placeholder="Which table in the Doc (1, 2…)" value="${escapeHtml(String((w.source && w.source.table) || ''))}">
          </div>
          <button type="button" class="dash-btn" id="ed-load">⤓ Load from Google</button>
          <div class="dash-muted dash-small">Sheets: Share → “Anyone with the link can view” (or File → Share → Publish to web). Docs: File → Share → Publish to web. “Sync now” on the card fetches the latest numbers later.</div>
        </div>
        <div class="dash-muted dash-small" id="ed-parsed"></div>
        <div id="ed-options"></div>
        <div class="dash-editor-preview"><div class="dash-muted dash-small">Preview</div><div id="ed-preview"></div></div>
        <div class="dash-error" id="ed-error"></div>
        <div class="dash-editor-actions">
          <button type="button" class="dash-icon-btn" id="ed-cancel">Cancel</button>
          <button type="button" class="submit-plan-btn" id="ed-save">💾 Save</button>
        </div>`;
      $('ed-paste').value = w.data.columns.length ? W.toText(w.data) : '';

      const colSelect = (id, value, { none } = {}) =>
        `<select id="${id}">${none ? `<option value="">${none}</option>` : ''}${w.data.columns
          .map((c, i) => `<option value="${i}"${Number(value) === i && value !== '' && value !== undefined ? ' selected' : ''}>${escapeHtml(c)}</option>`)
          .join('')}</select>`;

      function drawOptions() {
        const o = w.options;
        const cols = w.data.columns;
        if (!cols.length) {
          $('ed-options').innerHTML = '';
          return;
        }
        if (o.labelCol === undefined || o.labelCol >= cols.length) o.labelCol = 0;
        if (!o.valueCols || !o.valueCols.length) {
          // Columns holding numbers: a line chart starts with all of them (trends side by
          // side), the others with the first.
          const numeric = cols
            .map((_, i) => i)
            .filter((i) => i !== o.labelCol && w.data.rows.some((r) => Number.isFinite(W.number(r[i]))));
          o.valueCols = w.type === 'line' ? numeric.slice(0, 6) : numeric.slice(0, 1);
        }
        let html = '';
        if (w.type !== 'table') {
          html += `<label for="ed-label">Names (labels)</label>${colSelect('ed-label', o.labelCol)}`;
          const multi = w.type === 'bar' || w.type === 'line';
          html += `<label>${multi ? 'Numbers to show' : 'Numbers'}</label><div class="dash-cols">${cols
            .map((c, i) =>
              i === o.labelCol
                ? ''
                : `<label><input type="${multi ? 'checkbox' : 'radio'}" name="ed-val" value="${i}"${o.valueCols.includes(i) ? ' checked' : ''}> ${escapeHtml(c)}</label>`,
            )
            .join('')}</div>`;
        }
        if (w.type === 'bar') {
          html += `<label for="ed-stacked">Several number columns</label>
            <select id="ed-stacked">
              <option value=""${!o.stacked ? ' selected' : ''}>Side by side</option>
              <option value="sum"${o.stacked === 'sum' ? ' selected' : ''}>Stacked: totals</option>
              <option value="percent"${o.stacked === 'percent' ? ' selected' : ''}>Stacked: each bar to 100%</option>
            </select>`;
          html += `<label class="dash-check"><input type="checkbox" id="ed-vertical"${o.vertical ? ' checked' : ''}> Vertical bars${o.stacked ? '' : ' (instead of a leaderboard)'}</label>`;
          html += `<label class="dash-check"><input type="checkbox" id="ed-scale"${o.scale ? ' checked' : ''}> Colours as a scale (low → high, first column darkest)</label>`;
        }
        if (w.type === 'pie') html += `<label class="dash-check"><input type="checkbox" id="ed-donut"${o.donut !== false ? ' checked' : ''}> Donut (ring)</label>`;
        if (w.type === 'progress') {
          html += `<label for="ed-target">Target for everyone</label><input type="text" inputmode="decimal" id="ed-target" value="${o.target ?? ''}" placeholder="e.g. 15M or 15000000">`;
          html += `<label for="ed-targetcol">…or a column of targets</label>${colSelect('ed-targetcol', o.targetCol ?? '', { none: '(use the number above)' })}`;
        }
        if (w.type === 'table') {
          html += `<label for="ed-hlcol">Highlight rows where</label>${colSelect('ed-hlcol', o.highlightCol ?? '', { none: '(no highlight)' })}`;
          html += `<label for="ed-hlmin">is at least</label><input type="text" inputmode="decimal" id="ed-hlmin" value="${o.highlightMin ?? ''}" placeholder="e.g. 300M">`;
        }
        $('ed-options').innerHTML = html;
      }

      function readOptions() {
        const o = w.options;
        const val = (id) => $(id) && $(id).value;
        if ($('ed-label')) o.labelCol = Number(val('ed-label'));
        const checked = [...document.querySelectorAll('input[name="ed-val"]:checked')].map((x) => Number(x.value));
        if (document.querySelector('input[name="ed-val"]')) o.valueCols = checked;
        if ($('ed-vertical')) o.vertical = $('ed-vertical').checked;
        if ($('ed-stacked')) o.stacked = $('ed-stacked').value || undefined;
        if ($('ed-scale')) o.scale = $('ed-scale').checked;
        if ($('ed-donut')) o.donut = $('ed-donut').checked;
        if ($('ed-target')) {
          // Same shorthand as the data: 15M, 50K, 1.2B, 15,000,000
          const t = W.number(val('ed-target'));
          if (!Number.isFinite(t)) delete o.target;
          else o.target = t;
          if (val('ed-targetcol') === '') delete o.targetCol;
          else o.targetCol = Number(val('ed-targetcol'));
        }
        if ($('ed-hlcol')) {
          // Kept separately until both are set, so choosing the column first isn't lost.
          const min = W.number(val('ed-hlmin'));
          if (val('ed-hlcol') === '') delete o.highlightCol;
          else o.highlightCol = Number(val('ed-hlcol'));
          if (Number.isFinite(min)) o.highlightMin = min;
          else delete o.highlightMin;
        }
      }

      function preview() {
        w.title = $('ed-title').value;
        w.note = $('ed-note').value;
        w.visibility = $('ed-vis').value;
        const box = $('ed-preview');
        if (!w.data.columns.length) {
          box.innerHTML = '<div class="dw-empty">Paste a table above to see the chart.</div>';
          return;
        }
        box.innerHTML = W.render(w);
        W.mount(box, w);
      }

      // Where the data comes from: a pasted table, or a Google Sheet / Doc (loaded by the server).
      let mode = w.source && (w.source.kind === 'sheet' || w.source.kind === 'doc') ? 'link' : 'paste';
      function setMode(m) {
        mode = m;
        ed.querySelectorAll('.dash-src button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.src === m)));
        $('ed-src-paste').hidden = m !== 'paste';
        $('ed-src-link').hidden = m !== 'link';
      }
      function linkKind() {
        return /\/document\//.test($('ed-url').value) ? 'doc' : 'sheet';
      }
      function showLinkOptions() {
        $('ed-sheet-opts').hidden = linkKind() !== 'sheet';
        $('ed-doc-opts').hidden = linkKind() !== 'doc';
      }
      function linkSource() {
        const kind = linkKind();
        return kind === 'doc'
          ? { kind, url: $('ed-url').value.trim(), table: Number($('ed-table').value) || 1 }
          : { kind, url: $('ed-url').value.trim(), sheet: $('ed-sheet').value.trim(), range: $('ed-range').value.trim() };
      }
      function useData(parsed) {
        const changed = parsed.columns.join('\t') !== w.data.columns.join('\t');
        w.data = parsed;
        if (changed) w.options = { ...w.options, labelCol: 0, valueCols: [] };
        $('ed-parsed').textContent = parsed.columns.length
          ? `${parsed.rows.length} row${parsed.rows.length === 1 ? '' : 's'} × ${parsed.columns.length} column${parsed.columns.length === 1 ? '' : 's'}${parsed.rows.length > 500 ? ' (500 at most)' : ''}`
          : '';
        drawOptions();
        preview();
      }
      ed.querySelector('.dash-src').addEventListener('click', (e) => {
        const b = e.target.closest('[data-src]');
        if (b) setMode(b.dataset.src);
      });
      $('ed-url').addEventListener('input', showLinkOptions);
      $('ed-load').addEventListener('click', async () => {
        const btn = $('ed-load');
        btn.disabled = true;
        btn.textContent = '⤓ Loading…';
        $('ed-error').textContent = '';
        try {
          const res = await fetch('/api/dashboard', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${loginPass()}` },
            body: JSON.stringify({ action: 'load-source', source: linkSource(), alliance: data.alliance.tag }),
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
          w.source = linkSource();
          w.syncedAt = body.syncedAt;
          useData(body.data);
        } catch (err) {
          $('ed-error').textContent = err.message;
        }
        btn.disabled = false;
        btn.textContent = '⤓ Load from Google';
      });

      function readPaste() {
        useData(W.parseTable($('ed-paste').value));
      }

      $('ed-types').addEventListener('click', (e) => {
        const b = e.target.closest('[data-type]');
        if (!b) return;
        readOptions();
        w.type = b.dataset.type;
        ed.querySelectorAll('#ed-types button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        if (w.type === 'pie' || w.type === 'progress') w.options.valueCols = (w.options.valueCols || []).slice(0, 1);
        if (w.type === 'line' && (w.options.valueCols || []).length <= 1) w.options.valueCols = [];
        drawOptions();
        preview();
      });
      $('ed-paste').addEventListener('input', readPaste);
      ['ed-title', 'ed-note', 'ed-vis'].forEach((id) => $(id).addEventListener('input', preview));
      $('ed-options').addEventListener('change', () => {
        readOptions();
        drawOptions();
        preview();
      });
      $('ed-cancel').addEventListener('click', closeEditor);
      $('ed-save').addEventListener('click', async () => {
        readOptions();
        preview();
        if (mode === 'link') {
          if (!w.source || !w.source.url || w.source.url !== $('ed-url').value.trim()) {
            $('ed-error').textContent = 'Load the sheet first (⤓ Load from Google).';
            return;
          }
        } else {
          w.source = { kind: 'paste' };
          delete w.syncedAt;
        }
        const btn = $('ed-save');
        btn.disabled = true;
        btn.textContent = 'Saving…';
        const error = await save({ action: 'save-widget', widget: w });
        btn.disabled = false;
        btn.textContent = '💾 Save';
        if (error) $('ed-error').textContent = error;
        else closeEditor();
      });

      setMode(mode);
      showLinkOptions();
      if (mode === 'link') useData(w.data);
      else readPaste();
      ed.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    $('dash-switcher-select').addEventListener('change', (e) => load(e.target.value));
    load(new URLSearchParams(window.location.search).get('alliance'));
  })();
</script>
