title: Last Asylum Guide
description: A strategy compendium for Last Asylum.
theme: null
url: "https://la-s78.github.io"
kramdown:
  input: GFM
  syntax_highlighter: rouge
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - redirect.html
collections_dir: "collections"
collections:
  home:
    output: false
  rules:
    output: false
  guides:
    output: false
  guide_panes:
    output: false
  alliance:
    output: false
languages: ["de", "en", "es", "fr", "ru", "tr", "uk", "it"]
default_lang: "en"
defaults:
  - scope:
      path: "_guide_panes/de"
    values:
      lang: "de"
  - scope:
      path: "_guide_panes/en"
    values:
      lang: "en"
  - scope:
      path: "_guide_panes/es"
    values:
      lang: "es"
  - scope:
      path: "_guide_panes/fr"
    values:
      lang: "fr"
  - scope:
      path: "_guide_panes/ru"
    values:
      lang: "ru"
  - scope:
      path: "_guide_panes/tr"
    values:
      lang: "tr"
  - scope:
      path: "_guide_panes/uk"
    values:
      lang: "uk"
  - scope:
      path: "_guide_panes/it"
    values:
      lang: "it"