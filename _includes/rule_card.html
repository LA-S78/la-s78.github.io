<article class="rule-card">
    <header class="rule-header" style="border-bottom: 1px solid var(--border-color); margin-bottom: 15px; padding-bottom: 5px;">
        <h3 style="margin: 0; color: var(--accent-color);">{{ include.title }}</h3>
    </header>
    
    <div class="rule-content">
        {{ include.content }}
    </div>
</article>

{% unless include.last %}
<div class="pane-divider"></div>
{% endunless %}
