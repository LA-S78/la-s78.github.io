<section class="duel-schedule-grid">
    {% assign schedule = site.data.duel_schedule[include.lang] %}

    {% for item in schedule %}
    <article class="duel-day">
        <div class="day-header">
            <h3>{{ item.name }}</h3>
            <div class="day-title">{{ item.title }}</div>
        </div>
        <ul class="task-list">
            {% for task in item.tasks %}
            <li {% if task.warning %}class="warning"{% endif %}>
                {{ task.text }}
            </li>
            {% endfor %}
        </ul>
    </article>
    
    {% unless forloop.last %}
    <div class="pane-divider"></div>
    {% endunless %}
    {% endfor %}
</section>
