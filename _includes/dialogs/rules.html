<dialog id="rotationZoom" onclick="if(event.target==this) closeDialogGracefully(this)">
    <img src="/images/rotation.jpg" alt="Capitol Rotation Blueprint">
    
    <div class="dialog-controls" onclick="event.stopPropagation()">
        <a href="/images/rotation.jpg" 
           download="LastAsylum-Rotation.jpg" 
           class="dialog-btn">
           Download
        </a>  
        <button onclick="closeDialogGracefully(this.closest('dialog'))">Close</button>
    </div>
</dialog>
