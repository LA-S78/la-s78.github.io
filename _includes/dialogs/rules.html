<dialog id="rotationZoom" onclick="this.close()">
    <img src="/{{ site.active_lang }}/images/rotation.jpg" alt="Capitol Rotation Blueprint">
    
    <div class="dialog-controls" onclick="event.stopPropagation()">
        <a href="/{{ site.active_lang }}/images/rotation.jpg" 
           download="LastAsylum-Rotation.jpg" 
           class="dialog-btn">
           Download
        </a>  
        <button onclick="document.getElementById('rotationZoom').close()">Close</button>
    </div>
</dialog>

    <div class="dialog-controls" onclick="event.stopPropagation()">
        <a href="/{{ site.active_lang }}/images/rewards.jpg" 
           download="LastAsylum-Rewards.jpg" 
           class="dialog-btn">
           Download
        </a>  
        <button onclick="document.getElementById('rewardsZoom').close()">Close</button>
    </div>
</dialog>
