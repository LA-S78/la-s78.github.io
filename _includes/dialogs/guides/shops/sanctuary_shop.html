<dialog id="sanctuary-shopZoom" onclick="if(event.target==this) closeDialogGracefully(this)">
    <img src="/images/guides/sanctuary-shop.webp" alt="Sanctuary Shop">
    
    <div class="dialog-controls" onclick="event.stopPropagation()">
        <a href="/images/guides/sanctuary-shop.webp" 
           download="sanctuary-shop.webp" 
           class="dialog-btn">
           Download
        </a>
        <button onclick="closeDialogGracefully(this.closest('dialog'))">Close</button>
    </div>
</dialog>
