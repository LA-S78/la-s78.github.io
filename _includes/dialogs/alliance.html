<dialog id="mapZoom" onclick="this.close()">
    <img src="/{{ site.active_lang }}/images/map.jpg" alt="NAP Territory Map">
    <div class="dialog-controls" onclick="event.stopPropagation()">
        <a href="/{{ site.active_lang }}/images/map.jpg" 
           download="LastAsylum-Map.jpg" 
           class="dialog-btn">
           Download
        </a>  
        <button onclick="document.getElementById('mapZoom').close()">Close</button>
    </div>
</dialog>
