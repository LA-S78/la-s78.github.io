<dialog id="mapZoom" onclick="if(event.target==this) closeDialogGracefully(this)">
    <img src="/images/map.jpg" alt="NAP Territory Map">
    <div class="dialog-controls" onclick="event.stopPropagation()">
        <a href="/images/map.jpg" 
           download="LastAsylum-Map.jpg" 
           class="dialog-btn">
           Download
        </a>  
        <button onclick="closeDialogGracefully(this.closest('dialog'))">Close</button>
    </div>
</dialog>
