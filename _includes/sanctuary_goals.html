<div class="rule-card">
    <table class="list-table">
        {% assign goals = site.data.sanctuary_goals[include.lang] %}
        
        {% if goals %}
            {% for item in goals %}
            <tr>
                <td><b>{{ item.name }}</b></td>
                <td>{{ item.level }}</td>
            </tr>
            {% endfor %}
        {% else %}
            <tr><td colspan="2">Data missing for {{ include.lang }}</td></tr>
        {% endif %}
    </table>
</div>
