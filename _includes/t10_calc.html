{% assign lang = page.lang | default: "en" %}
{% assign t = site.data.t10[lang] %}

<div class="tree-container" data-txt-max="{{ t.max }}">
    
    <!-- Node 1: Advanced Protection -->
    <div class="node-wrapper">
        <div class="hex-node" id="node-adv">
            <div class="icon-placeholder">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.67-3.13 8.89-7 10.02-3.87-1.13-7-5.35-7-10.02v-4.7l7-3.12z"/></svg>
            </div>
        </div>
        <div class="node-controls">
            <!-- PULLING THE TITLE -->
            <div class="node-title">{{ t.adv_protection }}</div>
            <div class="level-stepper">
                <button class="level-btn" data-action="adjust-level" data-type="advProt" data-change="-1">-</button>
                <div class="level-display" id="disp-advProt">10/10</div>
                <button class="level-btn" data-action="adjust-level" data-type="advProt" data-change="1">+</button>
            </div>
        </div>
    </div>

    <div class="line-vertical"></div>
    
    <!-- The Split -->
    <div class="branch-container">
        <div class="branch-top"></div>
    </div>

    <!-- Node 2 & 3: Health & Attack -->
    <div class="branch-container" style="justify-content: space-between; margin-top: 0; width: 320px;">
        
        <!-- Health Node -->
        <div class="node-wrapper" style="margin: 0;">
            <div class="hex-node" id="node-health">
                <div class="icon-placeholder">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
            </div>
            <div class="node-controls">
                <div class="node-title">{{ t.health }}</div>
                <div class="level-stepper">
                    <button class="level-btn" data-action="adjust-level" data-type="health" data-change="-1">-</button>
                    <div class="level-display" id="disp-health">6/10</div>
                    <button class="level-btn" data-action="adjust-level" data-type="health" data-change="1">+</button>
                </div>
            </div>
        </div>

        <!-- Attack Node -->
        <div class="node-wrapper" style="margin: 0;">
            <div class="hex-node" id="node-attack">
                <div class="icon-placeholder">
                    <svg viewBox="0 0 24 24"><path d="M2.53 19.65l1.34.56v-9.03l-2.43 5.86c-.41 1.02.08 2.19 1.09 2.61zm19.5-3.7L17.07 3.98c-.31-.75-1.04-1.21-1.81-1.23-.26 0-.53.04-.79.15L7.1 5.95c-.75.31-1.21 1.03-1.23 1.8-.01.27.04.54.15.8l4.96 11.97c.31.76 1.05 1.22 1.83 1.23.26 0 .52-.05.77-.15l7.36-3.05c1.02-.42 1.51-1.59 1.09-2.6zM15.44 17L7.86 13.8 11.5 5 19.08 8.2 15.44 17z"/></svg>
                </div>
            </div>
            <div class="node-controls">
                <div class="node-title">{{ t.attack }}</div>
                <div class="level-stepper">
                    <button class="level-btn" data-action="adjust-level" data-type="attack" data-change="-1">-</button>
                    <div class="level-display" id="disp-attack">7/10</div>
                    <button class="level-btn" data-action="adjust-level" data-type="attack" data-change="1">+</button>
                </div>
            </div>
        </div>

    </div>

    <!-- The Merge -->
    <div class="branch-container">
        <div class="branch-bottom"></div>
    </div>

    <div class="line-vertical"></div>

    <!-- Node 4: Defense -->
    <div class="node-wrapper" style="margin: 0;">
        <div class="hex-node" id="node-defense">
            <div class="icon-placeholder">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 19c-4.04-1.16-7-5.06-7-9.45V6.47L12 3.32l7 3.15v5.08c0 4.39-2.96 8.29-7 9.45z"/></svg>
            </div>
        </div>
        <div class="node-controls">
            <div class="node-title">{{ t.defense }}</div>
            <div class="level-stepper">
                <button class="level-btn" data-action="adjust-level" data-type="defense" data-change="-1">-</button>
                <div class="level-display" id="disp-defense">3/10</div>
                <button class="level-btn" data-action="adjust-level" data-type="defense" data-change="1">+</button>
            </div>
        </div>
    </div>

    <div class="line-vertical"></div>

    <!-- Final Node: T10 Unlock -->
    <div class="node-wrapper" style="margin: 0;">
        <div class="hex-node locked" id="node-t10">
            <div class="icon-placeholder">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
            </div>
        </div>
        <div class="node-controls">
            <div class="node-title" style="color: var(--accent-bright);">{{ t.elite_troop }}</div>
            <button class="t10-toggle" id="btn-t10" 
                    data-locked="{{ t.locked }}" 
                    data-unlocked="{{ t.unlocked }}">
                {{ t.locked }} (0/1)
            </button>
        </div>
    </div>

</div>

<!-- Sticky Totals Footer -->
<div class="totals-banner">
    <div class="totals-container">
        <div class="total-item">
            <span class="total-label">{{ t.herbs }}</span>
            <span class="total-value" id="total-herbs">0</span>
        </div>
        <div class="total-item">
            <span class="total-label">{{ t.grain }}</span>
            <span class="total-value" id="total-grain">0</span>
        </div>
        <div class="total-item">
            <span class="total-label">{{ t.scrolls }}</span>
            <span class="total-value" id="total-scrolls">0</span>
        </div>
    </div>
</div>
<script src="/js/t10-calc.js"></script>
