<div class="guide-grid">
    {% for item in site.data.guide_directory[include.category] %}
    <a href="{{ item.url }}" 
       class="guide-card searchable-item {% if item.status == 'unavailable' %}unavailable{% endif %}" 
       {% if item.span %}style="grid-column: span {{ item.span }};"{% endif %}
       {% if item.tooltip %}title="{{ item.tooltip }}"{% endif %}>
        
        <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 10px auto; width: 32px; height: 32px; display: block;">
            {{ item.icon }}
        </svg>
        <span>{{ item.title }}</span>
    </a>
    {% endfor %}
</div>
