<div class="schedule-container">
<table class="schedule-table">
    <thead>
        <tr>
            <th>Time</th><th>Day 1</th><th>Day 2</th><th>Day 3</th><th>Day 4</th><th>Day 5</th><th>Day 6</th><th>Day 7</th>
        </tr>
    </thead>
    <tbody>
        {% for row in site.data.survival_battle %}
        <tr>
            <td>{{ row.time }}</td>
            <td class="{{ site.data.phase_colours[row.d1] }}">{{ row.d1 }}</td>
            <td class="{{ site.data.phase_colours[row.d2] }}">{{ row.d2 }}</td>
            <td class="{{ site.data.phase_colours[row.d3] }}">{{ row.d3 }}</td>
            <td class="{{ site.data.phase_colours[row.d4] }}">{{ row.d4 }}</td>
            <td class="{{ site.data.phase_colours[row.d5] }}">{{ row.d5 }}</td>
            <td class="{{ site.data.phase_colours[row.d6] }}">{{ row.d6 }}</td>
            <td class="{{ site.data.phase_colours[row.d7] }}">{{ row.d7 }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
