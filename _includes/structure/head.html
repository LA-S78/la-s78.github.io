<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Discord / Social Media Preview Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | default: '/images/default-social-banner.png' | absolute_url }}">
    <meta name="theme-color" content="#B8975A">

    <title>{{ page.title }} | {{ site.title }}</title>
    
    <link rel="stylesheet" href="/css/style.css?v={{ site.time | date: '%s' }}">
    <link rel="icon" href="/images/favicon.png">
    <script type="module" src="/js/turbo.js"></script>
    <script src="/js/main.js?v={{ site.time | date: '%s' }}" defer></script>
</head>
