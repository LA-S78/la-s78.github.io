{% comment %}
  Sign-in button / account pill (js/identity-pill.js fills it in from the stored Discord login).
  Hidden until the script has run, so a signed-in visitor doesn't see "Sign In" flash first.
{% endcomment %}
<div class="id-pill-wrap" id="identity-pill" data-tier="signed-out">
  <button type="button" class="id-pill"></button>
  <div class="id-pop" role="region" aria-label="{{ site.data[site.active_lang].ui.identity.account }}" hidden></div>
  <template class="id-discord-glyph">
    <svg class="id-discord-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
      <path d="M20.3 4.4A19.6 19.6 0 0 0 15.4 3l-.6 1.3a18.2 18.2 0 0 0-5.6 0L8.6 3a19.5 19.5 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.7 19.7 0 0 0 6 3l1.3-2.1a12.7 12.7 0 0 1-2-1l.5-.4a14 14 0 0 0 12.2 0l.5.4a12.8 12.8 0 0 1-2 1l1.3 2.1a19.6 19.6 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.6 8 10.6s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/>
    </svg>
  </template>
  <script type="application/json" class="id-strings">{{ site.data[site.active_lang].ui.identity | jsonify }}</script>
</div>
