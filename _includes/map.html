<div id="map-container">
  <!-- Map Bar Controls -->
  <div class="map-controls">
    <!-- Left: View Modes (Levels, Alliances, Resources) -->
    <div class="control-group left">
      <span class="control-label">View:</span>
      <div class="segmented-control">
        <button id="btn-mode-level" class="toggle-btn active" data-mode="level">Levels</button>
        <button id="btn-mode-alliance" class="toggle-btn" data-mode="alliance">Alliances</button>
        <button id="btn-mode-resource" class="toggle-btn" data-mode="resource">Resources</button>
      </div>
    </div>

    <!-- Right: Planner Mode & Submission -->
    <div class="control-group right">
      <!-- Buff Summary Drawer Toggle -->
      <button id="btn-toggle-buffs" class="draft-btn" type="button" aria-label="Toggle Buff Summary" aria-pressed="false">
        <span class="buffs-icon">⚖️</span>
        <span class="buffs-label">Buff Summary</span>
      </button>

      <button id="btn-toggle-draft" class="draft-btn" aria-pressed="false">
        <span class="draft-indicator"></span>
        <span class="draft-text">Planner Mode</span>
      </button>

      <!-- Alliance Override Input & Live Buff Chip -->
      <div id="planner-override-container" class="hidden">
        <input 
          type="text" 
          id="alliance-override" 
          placeholder="E.G. WLO" 
          maxlength="6" 
          autocomplete="off" 
          spellcheck="false"
          title="Type a tag to override click assignments. Leave blank to cycle." 
        />
        <div id="planner-alliance-buff-chip" class="buff-chip hidden"></div>
      </div>
      
      <button id="btn-submit-proposal" class="submit-plan-btn hidden" disabled>
        Submit Plan <span id="change-count-badge" class="badge">0</span>
      </button>
      <button id="btn-toggle-fullscreen" class="draft-btn" type="button" aria-label="Toggle Fullscreen" aria-pressed="false">
        <span class="fullscreen-icon">⛶</span>
        <span class="fullscreen-label">Fullscreen</span>
      </button>
    </div>
  </div>

  <!-- Resource Map Legend Strip (Compact Key: No Tallies, 3 Core Resources) -->
  <div id="resource-map-legend" class="resource-legend hidden" aria-hidden="true">
    <div class="legend-group">
      <span class="legend-chip"><span class="chip-color chip-grain"></span> 🌾 Grain</span>
      <span class="legend-chip"><span class="chip-color chip-timber"></span> 🪵 Timber</span>
      <span class="legend-chip"><span class="chip-color chip-herbs"></span> 🌿 Herbs</span>
    </div>
    <div class="legend-divider">|</div>
    <div class="legend-group">
      <span class="legend-chip"><span class="chip-pattern chip-solid"></span> Solid: Gather</span>
      <span class="legend-chip"><span class="chip-pattern chip-striped"></span> Stripe: Output</span>
    </div>
    <div class="legend-divider">|</div>
    <div class="legend-group">
      <span class="legend-chip"><span class="chip-color chip-capitol"></span> 👑 March</span>
      <span class="legend-chip"><span class="chip-color chip-training"></span> ⚔️ Train</span>
      <span class="legend-chip"><span class="chip-color chip-research"></span> 🔬 Tech</span>
      <span class="legend-chip"><span class="chip-color chip-building"></span> 🏰 Build</span>
    </div>
  </div>

  <!-- Scout Hover Tooltip -->
  <div id="map-tooltip"></div>

  <div class="game-map">
    {% include map.svg %}
  </div>

  <!-- Territory Detail Card -->
  <div id="territory-info-card" class="info-card idle">
    <div class="info-header">
      <span id="city-level-badge" class="badge">Level --</span>
      <h3 id="city-name">Hover over a territory</h3>
    </div>
    <div class="info-details">
      <span class="info-item"><strong>Owner:</strong> <span id="city-owner">Unclaimed</span></span>
      <span class="info-divider" aria-hidden="true">•</span>
      <span class="info-item"><strong>Buff:</strong> <span id="city-buff">None</span></span>
    </div>
  </div>

  <!-- Buff Equity Drawer -->
  <div id="buff-equity-drawer" class="buff-drawer hidden" aria-hidden="true">
    <div class="buff-drawer-header">
      <div class="drawer-title">
        <span class="drawer-icon">⚖️</span>
        <h3>Alliance Buff Distribution</h3>
      </div>
      <button id="btn-close-buffs" class="drawer-close-btn" type="button" aria-label="Close Buff Summary">&times;</button>
    </div>
    <div class="buff-drawer-subtitle">
      <span>Dynamic tally based on active map / planner assignments</span>
    </div>
    <div id="buff-drawer-content" class="buff-drawer-content">
      <!-- Populated dynamically via map.js -->
    </div>
  </div>
</div>

<script id="map-data" type="application/json">
  {{ site.data.map_state | jsonify }}
</script>
<script id="city-data" type="application/json">
  {{ site.data.cities | jsonify }}
</script>
<script>
  const dataElement = document.getElementById('map-data');
  window.MAP_STATE = JSON.parse(dataElement.textContent || '{}');
  const cityDataElement = document.getElementById('city-data');
  window.CITY_CATALOG = JSON.parse(cityDataElement.textContent || '{}');
</script>
<script type="module" src="/js/map.js" defer></script>
