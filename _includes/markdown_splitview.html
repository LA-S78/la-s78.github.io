<style>
    .split-view {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin: 20px 0;
    }

    .view-panel {
        flex: 1;
        border: 1px solid var(--border-color);
        padding: 15px;
        border-radius: 8px;
        background: rgba(0,0,0,0.05);
        transition: all 0.3s ease;
    }

    .view-panel h3 {
        margin-top: 0;
        font-size: 0.8rem;
        text-transform: uppercase;
        color: var(--accent-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .view-panel button {
        cursor: pointer;
        font-size: 0.65rem;
        padding: 2px 8px;
        background: var(--accent-color);
        color: white;
        border: none;
        border-radius: 4px;
    }

    /* 1. Hide buttons by default (Mobile-first) */
    .view-panel button {
        display: none;
    }

    /* 2. Show buttons only on desktop (when it becomes side-by-side) */
    @media (min-width: 768px) {
        .split-view { flex-direction: row; }
        
        .view-panel button {
            display: inline-block;
        }
    }

    pre {
        background: rgba(0, 0, 0, 0.3);
        padding: 15px;
        border-radius: 6px;
        overflow-x: auto;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 0.85rem;
    }

    /* Expansion Logic */
    .view-panel.full-width { flex: 0 0 100% !important; order: -1; }
    .split-view.has-expanded .view-panel:not(.full-width) { display: none; }

    @media (min-width: 768px) {
        .split-view { flex-direction: row; }
    }
</style>

{% assign w = site.data[site.active_lang].content.writers_page.splitview %}

<div class="split-view" id="markdown-container">
  
  <div class="view-panel" id="panel-source">
    <h3>
      {{ w.title_source }} 
      <button onclick="expandPanel(this, 'panel-source')" data-expand="{{ w.btn_expand }}" data-collapse="{{ w.btn_collapse }}">
        {{ w.btn_expand }}
      </button>
    </h3>
    <pre><code>{{ w.markdown_sample | escape }}</code></pre>
  </div>

  <div class="view-panel" id="panel-result">
    <h3>
      {{ w.title_rendered }} 
      <button onclick="expandPanel(this, 'panel-result')" data-expand="{{ w.btn_expand }}" data-collapse="{{ w.btn_collapse }}">
        {{ w.btn_expand }}
      </button>
    </h3>
    <div class="rendered-markdown">
      {{ w.markdown_sample | markdownify }}
    </div>
  </div>
</div>

<script>
function expandPanel(btn, panelId) {
    const container = document.getElementById('markdown-container');
    const panel = document.getElementById(panelId);
    
    panel.classList.toggle('full-width');
    container.classList.toggle('has-expanded');
    
    const isExpanded = panel.classList.contains('full-width');
    btn.textContent = isExpanded ? btn.dataset.collapse : btn.dataset.expand;
}
</script>
