{% assign d = site.data[site.active_lang].content.home_page.directories %}

<div class="directories" id="directoryContainer">
    <a href="/{{ site.active_lang }}/rules.html" class="dir-card searchable-item">
        <div class="dir-content">
            <span class="dir-title">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 21H6a2 2 0 0 1-2-2v-1h11v1a2 2 0 0 0 4 0V5a2 2 0 0 1 2-2H8a2 2 0 0 0-2 2v13"/>
                    <path d="M21 3a2 2 0 0 1 0 4h-2"/>
                    <path d="M9.5 8h6"/>
                    <path d="M9.5 12h6"/>
                </svg> {{ d.rules.title }}
            </span>
            <span class="dir-sub">{{ d.rules.sub }}</span>
        </div>
        <div class="dir-arrow">></div>
    </a>

    <a href="/{{ site.active_lang }}/guides/index.html" class="dir-card searchable-item">
        <div class="dir-content">
            <span class="dir-title">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/>
                    <path d="M9 3v15"/>
                    <path d="M15 6v15"/>
                </svg> {{ d.guides.title }}
            </span>
            <span class="dir-sub">{{ d.guides.sub }}</span>
        </div>
        <div class="dir-arrow">></div>
    </a>

    <a href="/{{ site.active_lang }}/alliance.html" class="dir-card searchable-item">
        <div class="dir-content">
            <span class="dir-title">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 20s-6-3-6-8V6l6-2 6 2v6c0 5-6 8-6 8z"/>
                    <path d="M15.5 4.2 21 6v6c0 4.2-3.6 6.9-5.6 7.8"/>
                </svg> {{ d.alliance.title }}
            </span>
            <span class="dir-sub">{{ d.alliance.sub }}</span>
        </div>
        <div class="dir-arrow">></div>
    </a>

    <a href="/{{ site.active_lang }}/calendar.html" class="dir-card searchable-item">
        <div class="dir-content">
            <span class="dir-title">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 8V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/>
                    <path d="M16 2v4M8 2v4M3 10h6"/>
                    <circle cx="16.5" cy="16.5" r="5.5"/>
                    <path d="M16.5 14.5v2l1.3 1.3"/>
                </svg> {{ d.calendar.title }}
            </span>
            <span class="dir-sub">{{ d.calendar.sub }}</span>
        </div>
        <div class="dir-arrow">></div>
    </a>
</div>
