{% assign d = site.data[site.active_lang].content.home_page.directories %}

<div class="directories" id="directoryContainer">
    <a href="/{{ site.active_lang }}/rules.html" class="dir-card searchable-item">
        <div class="dir-content">
            <span class="dir-title">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3H7c-1.1 0-2 0.9-2 2v14c0 1.1 0.9 2 2 2h10c1.1 0 2-0.9 2-2V5c0-1.1-0.9-2-2-2z" />
                    <path d="M9 7h6" /><path d="M9 11h6" /><path d="M9 15h4" />
                    <circle cx="17" cy="19" r="1.5" fill="none" /><path d="M17 17.5v-2" />
                </svg> {{ d.rules.title }}
            </span>
            <span class="dir-sub">{{ d.rules.sub }}</span>
        </div>
        <div class="dir-arrow">></div>
    </a>

    <a href="/{{ site.active_lang }}/guides/index.html" class="dir-card searchable-item">
        <div class="dir-content">
            <span class="dir-title">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 2h4M12 2v4l3 3v10a3 3 0 0 1-6 0V9l3-3V2z" />
                    <path d="M9 16h6" />
                </svg> {{ d.guides.title }}
            </span>
            <span class="dir-sub">{{ d.guides.sub }}</span>
        </div>
        <div class="dir-arrow">></div>
    </a>

    <a href="/{{ site.active_lang }}/alliance.html" class="dir-card searchable-item">
        <div class="dir-content">
            <span class="dir-title">
                <svg class="nav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                </svg> {{ d.alliance.title }}
            </span>
            <span class="dir-sub">{{ d.alliance.sub }}</span>
        </div>
        <div class="dir-arrow">></div>
    </a>
</div>
