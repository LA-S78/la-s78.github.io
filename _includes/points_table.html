{% assign current_lang = include.lang | default: "en" %}

<table class="list-table table-spaced">
    <tbody>
        {% for item in site.data.kingdom_points[current_lang] %}
        <tr class="{{ item.category }}">
            <td>{{ item.task }}</td>
            <td class="points-value">{{ item.points }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
