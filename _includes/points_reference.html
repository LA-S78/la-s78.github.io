<section class="points-reference">
    <div class="points-grid">
        {% assign reference = site.data.points_reference[include.lang] %}
        
        {% for card in reference %}
        <div class="point-card">
            <h4>{{ card.title }}</h4>
            {% for line in card.points %}
            <p>{{ line }}</p>
            {% endfor %}
            <small>{{ card.note }}</small>
        </div>
        {% endfor %}
    </div>
</section>

<style>
    .points-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-bottom: 30px;
    }
    .point-card {
        background: #1e1b1a;
        padding: 15px;
        border: 1px solid #3d3734;
        border-radius: 8px;
    }
    .point-card h4 {
        margin: 0 0 10px 0;
        color: var(--accent-color);
    }
    .point-card p { margin: 5px 0; font-size: 0.9rem; }
</style>
