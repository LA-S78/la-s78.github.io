    <style>
    /* --- GUIDES SECTION ICONS --- */
.guide-icon {
    width: 32px; 
    height: 32px; 
    margin-bottom: 10px;
    display: block; 
    margin-left: auto; 
    margin-right: auto;
    stroke: var(--accent-color); /* This applies your brass/gold theme globally */
    transition: transform 0.2s ease;
}
/* --- STENCIL METHOD --- */
.guide-icon-mask {
    width: 32px;
    height: 32px;
    margin: 0 auto 10px auto; /* Centered */
    
    /* 1. Define the color you want */
    background-color: var(--accent-color);
    
    /* 2. Use your SVG as a stencil */
    -webkit-mask-image: url('images/farming.svg');
    mask-image: url('images/farming.svg');
    
    /* 3. Ensure it fits perfectly */
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-size: contain;
    mask-size: contain;
    
    transition: transform 0.2s ease;
}

/* Interactivity: Slight scale on hover */
.guide-card:hover .guide-icon .guide-icon-mask {
    transform: scale(1.15);
}

    </style>
