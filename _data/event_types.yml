# The calendar's event types: one list for the scheduling form, the calendar's type filter,
# each event's icon and its guide link (owner decision, 2026-11-15). Edit here only.
#
#   id:         the type's name in data; an event made from it stores it (`event_type`).
#               Don't rename one once events use it.
#   preset:     offered in the scheduling form ("Event type"), filling in the fields below
#   color:      the form's preset colour for the event
#   duration:   hours, the form's default length
#   recurrence: the form's default repeat: none | weekly | 2days
#   guide:      a guide's id (/<lang>/guides/<guide>.html): every event of this type links to
#               it automatically. Leave it out when there's no guide (yet).
#   match:      older titles that also mean this type (events made before types were stored
#               are matched by title; the type's name in every language is matched already)
#   icon:       the SVG inside a 24x24 line icon (stroke, no fill), as the guide icons are
#   picture:    a scene behind the event's card: images/events/<file>, 1600x400 WebP, subject
#               right of centre, calm left third (the card fades it into the theme's colour)
#   card_picture: the same scene at 3:2 (720x483 WebP), for the guide's card on the Guides
#               page and Pinned Pages, which are nearer square; without it they use `picture`
#
# Names and descriptions are translated: event_presets.<id>_title / <id>_desc and the form's
# label calendar_events.preset_<id> (_data/en/tools.yml). The site's own milestones (Capitol
# capture, Kingdom War battle, rewards) are types too (preset: false), set by api/calendar.js.

types:
  - id: crystal_cluster
    preset: true
    color: '#7946C0'
    duration: 0.5
    recurrence: weekly
    guide: crystal
    picture: crystal_cluster.webp
    icon: '<path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/>'

  - id: elixir_scramble
    preset: true
    color: '#24523B'
    duration: 0.5
    recurrence: weekly
    picture: elixir_scramble.webp
    icon: '<path d="M10 2v7.5a2 2 0 0 1-.2.9L4.7 20.6a1 1 0 0 0 .9 1.4h12.8a1 1 0 0 0 .9-1.4l-5.1-10.2a2 2 0 0 1-.2-.9V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>'

  - id: survival_battle
    preset: true
    color: '#CF6214'
    duration: 4
    recurrence: none
    guide: survival
    icon: '<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.6 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.6 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M8.8 11.2a1.9 1.9 0 0 1 3.2-1.2 1.9 1.9 0 0 1 3.2 1.2c0 1.8-3.2 3.8-3.2 3.8s-3.2-2-3.2-3.8"/>'

  - id: kill_event
    preset: true
    color: '#B12A2A'
    duration: 24
    recurrence: none
    guide: kill_event
    picture: kill_event.webp
    card_picture: kill_event_card.webp
    icon: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M22 12h-4M6 12H2M12 6V2M12 22v-4"/>'

  # Owner, 2026-11-17: its own event (a behemoth hunt). Length and repeat not known yet:
  # 1 hour, no repeat. No guide yet.
  - id: hunt_battle
    preset: true
    color: '#8C3B1F'
    duration: 1
    recurrence: none
    picture: hunt_battle.webp
    card_picture: hunt_battle_card.webp
    # claw marks
    icon: '<path d="M7 3c1.2 5 .4 11.5-3 17"/><path d="M12.5 2c1.2 6 .3 13-3 20"/><path d="M18 3c1.2 5 .4 11.5-3 17"/>'

  # Owner, 2026-11-15: its own event. Length and repeat not known yet: 1 hour, no repeat.
  - id: undead_siege
    preset: true
    color: '#5E7A45'
    duration: 1
    recurrence: none
    picture: undead_siege.webp
    icon: '<path d="M12 3a8 8 0 0 0-8 8c0 2.4 1 4.4 2.7 5.8V20a1 1 0 0 0 1 1h8.6a1 1 0 0 0 1-1v-3.2A7.9 7.9 0 0 0 20 11a8 8 0 0 0-8-8z"/><circle cx="9" cy="11.5" r="1.6"/><circle cx="15" cy="11.5" r="1.6"/><path d="M10 21v-2.5M14 21v-2.5M11.2 15.6l.8-1.4.8 1.4"/>'

  # The Kingdom War battle: a preset leaders can schedule, and the site's own Saturday battle
  - id: kvk_battle
    preset: true
    color: '#8ED2EF'
    duration: 1
    recurrence: none
    guide: kingdom
    picture: kvk_battle.webp
    card_picture: kvk_battle_card.webp
    match: ['Kingdom War', 'Kingdom War Battle', 'KvK', 'KvK Battle', 'Kingdom vs Kingdom']
    icon: '<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6M16 16l4 4M19 21l2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="m5 14 4 4M7 17l-3 3M3 19l2 2"/>'

  # "Gear Upgrade" (owner, 2026-11-15; was "Gear Event"): gear as in armour and weapons
  - id: gear_upgrade
    preset: true
    color: '#303A40'
    duration: 48
    recurrence: none
    match: ['Gear Event']
    picture: gear_upgrade.webp
    icon: '<path d="M8 3 4.5 5 3 9.5l2.5 1.5V19a2 2 0 0 0 1.2 1.8L12 22l5.3-1.2A2 2 0 0 0 18.5 19v-8L21 9.5 19.5 5 16 3c-.6 1.8-2.2 3-4 3S8.6 4.8 8 3z"/><path d="M12 6v16"/><path d="M8 12.5c1.3.6 2.6.9 4 .9s2.7-.3 4-.9"/>'

  - id: cheese_trap
    preset: true
    color: '#FAB22F'
    duration: 0.5
    recurrence: 2days
    guide: cheese
    picture: cheese_trap.webp
    icon: '<path d="M3 19v-7.5L16.5 5 21 11.5V19z"/><path d="M3 11.5h18"/><circle cx="8" cy="15.5" r="1.3"/><circle cx="14.5" cy="15" r="1.8"/><circle cx="15.5" cy="8.8" r=".9"/>'

  # The site's own milestones (api/calendar.js sets their type)
  - id: capitol_capture
    preset: false
    icon: '<path d="M11.6 3.3a.5.5 0 0 1 .9 0l2.9 5.6a1 1 0 0 0 1.5.3l4.3-3.7a.5.5 0 0 1 .8.5l-2.8 10.3a1 1 0 0 1-1 .7H5.8a1 1 0 0 1-1-.7L2 6a.5.5 0 0 1 .8-.5l4.3 3.7a1 1 0 0 0 1.5-.3z"/><path d="M5 21h14"/>'

  - id: rewards_open
    preset: false
    icon: '<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>'

  - id: rewards_close
    preset: false
    icon: '<path d="M5 22h14M5 2h14"/><path d="M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4a2 2 0 0 0-.6 1.4V22"/><path d="M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4a2 2 0 0 0 .6-1.4V2"/>'

# Icons that aren't event types
icons:
  # An event of no type: an alliance's (shield with a tick) or the server's (flag)
  alliance: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 11l2 2 4-4"/>'
  server: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>'
  # The labels on an event: it repeats; it's mandatory
  repeats: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>'
  mandatory: '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3"/><path d="M12 9v4M12 17h.01"/>'
  # The week's "king" (the Capitol seat)
  crown: '<path d="M11.6 3.3a.5.5 0 0 1 .9 0l2.9 5.6a1 1 0 0 0 1.5.3l4.3-3.7a.5.5 0 0 1 .8.5l-2.8 10.3a1 1 0 0 1-1 .7H5.8a1 1 0 0 1-1-.7L2 6a.5.5 0 0 1 .8-.5l4.3 3.7a1 1 0 0 0 1.5-.3z"/><path d="M5 21h14"/>'
  # The link to an event's guide: the footer's Guides map (_includes/structure/footer.html)
  guide: '<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15"/><path d="M15 6v15"/>'
