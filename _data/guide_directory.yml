# The guides directory (Guides page, home Pinned Pages): each guide's link, status and icon.
# Icons (owner request, 2026-11-17) are 24x24 line drawings that show what the guide is about;
# a guide with an event on the calendar uses that event's icon (_data/event_types.yml), so the
# same event looks the same everywhere.
#
#   event:    the guide's event on the calendar (an id in _data/event_types.yml). Its card
#             shows that event's picture behind it, dimmed, as the calendar does (owner
#             request, 2026-11-17), so a picture added to the event shows here too.
#   picture:  a picture for a guide with no event: a file in images/events/ (same rules as
#             event_types.yml `picture`)
