# Messages the server sends to the site's pages (api/_messages.js say('section.key')).
# Section names start with api_ so they never clash with tools.yml's (overrides use the name).
# Edit the English here only: _scripts/translate_sections.rb translates a section again
# whenever its English changes. {words} in braces are filled in by the server; keep them.
# Technical messages for administrators (set-up, raw Discord errors) aren't here.

