# The tools' text in English: the only copy people edit.
#
# Each top-level key is a section. When anything in a section changes, the whole section is
# translated again into every language by Gemini when it reaches main
# (_scripts/translate_sections.rb, writing _data/<lang>/tools.yml). Until then, and for
# anything not translated yet, pages show the English.
#
# - {name} placeholders are filled in by the code: keep them, in any order the sentence needs.
# - Keys ending in _one / _other are the singular and plural of the same text.
# - Used in pages as {{ "dashboard.title" | t }} and in scripts as t('dashboard.title')
#   (see _plugins/tool_strings.rb and js/i18n.js).

