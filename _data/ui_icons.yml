# The site's interface icons (owner request, 2026-11-16: line icons instead of emojis in the
# tools). Each is the inside of a 24×24 line drawing (stroke, no fill), the same style as the
# event type icons (_data/event_types.yml) and the guide icons.
#
# Used from:
#   page templates:  {% include ui-icon.html name="pencil" %}  (optional: tone="ok")
#   scripts:         uiIcon('pencil')  /  uiIcon('check', 'ok')   (js/ui-icons.js, written
#                    from this file by _scripts/build.rb)
# Tones colour an icon by meaning: ok (green), bad (red), warn (amber), wait (muted);
# 'solo' is for an icon-only button (no gap after it).
# Discord messages keep their emojis: Discord can't show these.

