- title: "📜 1. Уважение и поведение"
  content: >
    <p><strong>Нулевая терпимость:</strong> Запрещены травля, расизм, разжигание ненависти, домогательства или токсичное поведение.<br><strong>Общественный стандарт:</strong> Относитесь ко всем игрокам с уважением.<br><strong>Жалобы:</strong> Вы <strong>обязаны</strong> предоставить скриншоты/доказательства при сообщении о нарушении.</p>
- title: "🛡️ 2. Правила защиты NAP"
  content: >
    <p>Следующие действия против <strong>NAP-альянсов</strong> и их <strong>Academies</strong> запрещены:</p><div style='background: rgba(180, 40, 40, 0.1); border: 1px solid #8b0000; padding: 10px; text-align: center; border-radius: 4px; color: #ff6b6b; margin-top: 10px;'>🚫 Запрет атак<br>🚫 Запрет разведки</div>
- title: "💎 3. Этикет на карте и с ресурсами"
  content: >
    <p><strong>Безопасность плиток:</strong> Строго запрещено атаковать плитки ресурсов. Позвольте игрокам собирать ресурсы спокойно.</p>
- title: "🚛 4. Caravans & Black Ops"
  content: >
    <p>Регулируется <strong>системой трех предупреждений</strong>:</p><p><strong>1-е и 2-е предупреждение:</strong> Сообщается офицерами R4. Нарушитель получает официальное предупреждение.<br><strong>3-е предупреждение:</strong> Ведет к штрафу в виде <strong>одиночного удара по базе</strong>.<br><strong>Разрешение конфликтов:</strong> Пострадавшие могут отозвать жалобу, если принесены извинения.</p>
- title: "🤝 5. Переманивание игроков"
  content: >
    <p><strong>Активный набор:</strong> Запрещено писать участникам других NAP-альянсов с предложением сменить альянс.<br><strong>Автономия игроков:</strong> Игроки могут свободно покидать альянсы и вступать в другие добровольно.<br><strong>Заявки:</strong> 'Входящие' заявки разрешены, если не было предварительной вербовки.</p>
- title: "📉 6. Другие альянсы"
  content: >
    <p><strong>Честная игра:</strong> Запрещено атаковать более слабые альянсы только потому, что они вне NAP.</p>
- title: "🕊️ 7. Дипломатия и разрешение конфликтов"
  content: >
    <p>1. <strong>Частное разрешение:</strong> Сначала решайте споры в частном порядке между главами/дипломатами альянсов.<br>2. <strong>Эскалация:</strong> Если не решено, обращайтесь к <strong>руководству NAP</strong>.</p><blockquote>⚠️ Не выносите споры о правилах, обиды или драму в Общий или Мировой чат. Используйте личные каналы.</blockquote>
- title: "🎓 8. Academies"
  content: >
    <p><strong>Обозначение:</strong> Каждый NAP-альянс может защищать <strong>одну</strong> academy.<br><strong>Управление:</strong> Academies, входящие в Топ-10, не получают права голоса, пока сохраняют статус academy.</p>
- title: "⚠️ 9. Общие нарушения правил"
  content: >
    <p><em>(Кроме №4)</em></p><p><strong>1-е нарушение:</strong> Официальное предупреждение.<br><strong>2-е нарушение:</strong> Исключение из альянса или <strong>Черный список NAP</strong>.<br><strong>Политика черного списка:</strong> Запрещает вступление в любой NAP-альянс.</p>