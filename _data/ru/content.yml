    markdown_sample: |
      ## 1. Стратегия развития 
      
      Гонка до Убежища 30-го уровня — главная цель для долгосрочной силы аккаунта, но спешка без планирования приводит к «узким местам».
      
      > #### ⚠️ Важная информация
      > 
      > **Никогда не начинайте улучшение, не проверив предварительные требования.** Вы же не хотите копить ресурсы 2 дня только для того, чтобы понять, что забыли повысить уровень Лаборатории или Тренировочного лагеря.
      
      Развитие меняется в районе 20-го уровня. До 20-го всё идет просто. После 20-го вам придется расставить приоритеты для конкретного списка «Необходимых зданий», поскольку они будут отнимать больше всего времени.
      
      ## 2. Таблица требований к уровню
      
      Используйте таблицу ниже для планирования очереди строительства. Это включает в себя затраты ресурсов и требования к конкретным постройкам, чтобы предотвратить остановку строительства.
      
      (вставьте таблицу сюда)
      
      ## 3. Целевые пределы для зданий
      
      Как только вы достигнете этих уровней, вы выполните все предварительные требования для Убежища 30. Вы можете понизить приоритет этих зданий и перенаправить ресурсы на войска и технологии.
      
      * **Лаборатория:** Уровень 30
      * **Тренировочный лагерь:** Уровень 30
      * **Командный центр:** Уровень 30
      * **Стена:** Уровень 30
      * **Склад:** Уровень 25 (Предел эффективности)
      * **Ресурсные здания:** Уровень 25 (Предел обслуживания)
      
      ## 4. Эффективность и расходы
      
      Переход с 25-го на 30-й уровень представляет собой самый крутой подъем в игре. Чтобы сохранить темп:
      
      * **Скорость строительства:** Убедитесь, что ваше исследование «Скорость строительства» в Лаборатории прокачано до максимума. Это дает накопительный бонус, который экономит недели времени к 30-му уровню.
      * **Согласование:** По возможности совмещайте крупные улучшения зданий с событием «Дуэль Альянсов», чтобы зарабатывать очки за свои усилия.
      * **Титулы:** Обязательно используйте Министра строительства или Начальника по делам перед началом стройки. Эти баффы могут резко сократить время строительства.