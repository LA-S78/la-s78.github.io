- title: "📜 1. Respeto y Conducta"
  content: >
    <p><strong>Tolerancia cero:</strong> Se prohíbe el acoso, racismo, lenguaje de odio o comportamiento tóxico.<br><strong>Estándar comunitario:</strong> Trata a todos los jugadores con respeto.<br><strong>Denuncias:</strong> <strong>Debes</strong> proporcionar capturas de pantalla/pruebas al reportar una infracción.</p>
- title: "🛡️ 2. Reglas de Protección NAP"
  content: >
    <p>Las siguientes acciones contra <strong>Alianzas NAP</strong> y sus <strong>Academies</strong> están prohibidas:</p><div style='background: rgba(180, 40, 40, 0.1); border: 1px solid #8b0000; padding: 10px; text-align: center; border-radius: 4px; color: #ff6b6b; margin-top: 10px;'>🚫 Prohibido atacar<br>🚫 Prohibido explorar</div>
- title: "💎 3. Recursos y Etiqueta de Mapa"
  content: >
    <p><strong>Seguridad de tiles:</strong> Está estrictamente prohibido atacar tiles de recursos. Deja que los jugadores recolecten en paz.</p>
- title: "🚛 4. Caravanas y Operaciones Especiales (Black Ops)"
  content: >
    <p>Regido por un <strong>Sistema de Tres Faltas</strong>:</p><p><strong>Faltas 1 y 2:</strong> Reportadas por R4s. El infractor recibe una advertencia formal.<br><strong>Falta 3:</strong> Resulta en una penalización de <strong>Un Golpe a la Base</strong>.<br><strong>Resolución de conflictos:</strong> Las víctimas pueden renunciar al reporte si se acepta una disculpa.</p>
- title: "🤝 5. Reclutamiento (Poaching)"
  content: >
    <p><strong>Reclutamiento activo:</strong> Está prohibido contactar miembros de otras alianzas NAP para que cambien.<br><strong>Autonomía del jugador:</strong> Los jugadores son libres de abandonar y unirse a alianzas voluntariamente.<br><strong>Solicitudes:</strong> Se permiten las solicitudes 'espontáneas' si no hubo solicitud previa.</p>
- title: "📉 6. Otras Alianzas"
  content: >
    <p><strong>Juego limpio:</strong> Está prohibido atacar alianzas más pequeñas por estar fuera del NAP.</p>
- title: "🕊️ 7. Diplomacia y Resolución de Conflictos"
  content: >
    <p>1. <strong>Resolución privada:</strong> Gestiona disputas en privado entre Líderes/Diplomáticos primero.<br>2. <strong>Escalación:</strong> Si no se resuelve, llevar al <strong>Liderazgo NAP</strong>.</p><blockquote>⚠️ No lleves disputas, quejas o drama al Chat General o Mundial. Mantente en canales privados.</blockquote>
- title: "🎓 8. Academies"
  content: >
    <p><strong>Designación:</strong> Cada alianza NAP puede proteger <strong>una</strong> academy.<br><strong>Gobernanza:</strong> Las Academies que entren en el Top 10 no reciben derechos de voto mientras mantengan su estatus de academy.</p>
- title: "⚠️ 9. Violaciones Generales"
  content: >
    <p><em>(Excepto la #4)</em></p><p><strong>1ra infracción:</strong> Advertencia oficial.<br><strong>2da infracción:</strong> Expulsión de la alianza o <strong>Lista Negra NAP</strong>.<br><strong>Política de Lista Negra:</strong> Prohíbe unirse a cualquier alianza bajo protección NAP.</p>