  - day: 1
    name: "День 1 | Понеділок"
    title: "Покращення Ворона"
    tasks:
      - text: "Зберіть квести Сокола"
      - text: "Збирайте ресурси з плиток"
      - text: "Підвищіть рівень Ворона (використовуйте плоди/есенцію)"
      - text: "Витрачайте витривалість"
      - text: "Використовуйте антитоксин (при потребі)"
  - day: 2
    name: "День 2 | Вівторок"
    title: "День території"
    tasks:
      - text: "Завершіть будівництво споруд"
      - text: "НЕ збирайте квести Сокола!"
        warning: true
      - text: "Витрачайте прискорення будівництва"
      - text: "Використовуйте каравани UR та квитки Black Ops"
      - text: "Наймайте вцілілих"
  - day: 3
    name: "День 3 | Середа"
    title: "Дослідження технологій"
    tasks:
      - text: "Зберіть квести Сокола"
      - text: "Завершіть дослідження"
      - text: "Витрачайте прискорення досліджень"
      - text: "Використовуйте сувої навчання"
      - text: "Відкривайте скрині Ворона"
  - day: 4
    name: "День 4 | Четвер"
    title: "Покращення героїв"
    tasks:
      - text: "Використовуйте універсальні уламки героїв"
      - text: "Використовуйте значки навичок"
      - text: "НЕ збирайте квести Сокола!"
        warning: true
      - text: "Наймайте героїв (квитки)"
  - day: 5
    name: "День 5 | П'ятниця"
    title: "Підготовка до війни"
    tasks:
      - text: "Зберіть квести Сокола"
      - text: "Тренуйте солдатів"
      - text: "Витрачайте прискорення тренування"
      - text: "Підвищуйте міць споруд/технологій (залишкові прискорення)"
  - day: 6
    name: "День 6 | Субота"
    title: "Рейд на ворога (KE)"
    tasks:
      - text: "Перемагайте ворожих солдатів"
      - text: "Втрачайте солдатів"
      - text: "Витрачайте залишкові прискорення"
      - text: "Використовуйте залишкові квитки каравану/Black Ops"
      - text: "<strong>НЕ ЗАБУДЬТЕ АКТИВУВАТИ ЩИТ!</strong>"
        warning: true