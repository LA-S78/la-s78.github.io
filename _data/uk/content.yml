  usage:
    title: "Використання Markdown"
    text: |
     * `##`    = Великий заголовок
     * `####`  = Малий заголовок
     * `**`    = Жирний текст
     * `*`     = Маркер списку
     * `>`     = Текстовий блок/Виноска
  example:
    title: "Приклад Markdown"
  submissions:
    title: "Відправлення гайдів"
    text: "Гайди можна писати звичайним текстом або у форматі markdown, надсилайте їх @JJosh у Discord S78."
  splitview:
    title_source: "Вихідний код Markdown"
    title_rendered: "Готовий результат"
    btn_expand: "Розгорнути"
    btn_collapse: "Згорнути"
    markdown_sample: |
      ## 1. Стратегія розвитку 
      
      Гонка до Сховища 30-го рівня — головна мета для довгострокової сили акаунта, але поспіх без планування призводить до «вузьких місць».
      
      > #### ⚠️ Важлива інформація
      > 
      > **Ніколи не починайте поліпшення, не перевіривши попередні вимоги.** Ви ж не хочете збирати ресурси 2 дні лише для того, щоб зрозуміти, що забули підвищити рівень Лабораторії або Тренувального табору.
      
      Розвиток змінюється в районі 20-го рівня. До 20-го все йде просто. Після 20-го вам доведеться розставити пріоритети для конкретного списку «Необхідних будівель», оскільки вони забиратимуть найбільше часу.
      
      ## 2. Таблиця вимог до рівня
      
      Використовуйте таблицю нижче для планування черги будівництва. Це включає в себе витрати ресурсів і вимоги до конкретних споруд, щоб запобігти зупинці будівництва.
      
      (вставте таблицю сюди)
      
      ## 3. Цільові межі для будівель
      
      Як тільки ви досягнете цих рівнів, ви виконаєте всі попередні вимоги для Сховища 30. Ви можете знизити пріоритет цих будівель і перенаправити ресурси на війська і технології.
      
      * **Лабораторія:** Рівень 30
      * **Тренувальний табір:** Рівень 30
      * **Командний центр:** Рівень 30
      * **Стіна:** Рівень 30
      * **Склад:** Рівень 25 (Межа ефективності)
      * **Ресурсні будівлі:** Рівень 25 (Межа обслуговування)
      
      ## 4. Ефективність і витрати
      
      Перехід з 25-го на 30-й рівень є найкрутішим підйомом у грі. Щоб зберегти темп:
      
      * **Швидкість будівництва:** Переконайтеся, що ваше дослідження «Швидкість будівництва» в Лабораторії прокачано до максимуму. Це дає накопичувальний бонус, який економить тижні часу до 30-го рівня.
      * **Узгодження:** За можливості поєднуйте великі покращення будівель із подією «Дуель Альянсів», щоб заробляти очки за свої зусилля.
      * **Титули:** Обов'язково використовуйте Міністра будівництва або Начальника у справах перед початком будівництва. Ці бафи можуть різко скоротити час будівництва.