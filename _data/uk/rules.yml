- title: "📜 1. Повага та поведінка"
  content: >
    <p><strong>Нульова терпимість:</strong> Заборонено цькування, расизм, мову ненависті, домагання чи токсичну поведінку.<br><strong>Громадський стандарт:</strong> Ставтеся до всіх гравців з повагою.<br><strong>Скарга:</strong> Ви <strong>зобов'язані</strong> надати скріншоти/докази при повідомленні про порушення.</p>
- title: "🛡️ 2. Правила захисту NAP"
  content: >
    <p>Наступні дії проти <strong>NAP-альянсів</strong> та їхніх <strong>Academies</strong> заборонені:</p><div style='background: rgba(180, 40, 40, 0.1); border: 1px solid #8b0000; padding: 10px; text-align: center; border-radius: 4px; color: #ff6b6b; margin-top: 10px;'>🚫 Заборона атак<br>🚫 Заборона розвідки</div>
- title: "💎 3. Етикет на карті та з ресурсами"
  content: >
    <p><strong>Безпека плиток:</strong> Суворо заборонено атакувати плитки ресурсів. Дозвольте гравцям збирати ресурси спокійно.</p>
- title: "🚛 4. Caravans & Black Ops"
  content: >
    <p>Регулюється <strong>системою трьох попереджень</strong>:</p><p><strong>1-ше та 2-ге попередження:</strong> Повідомляється офіцерами R4. Порушник отримує офіційне попередження.<br><strong>3-тє попередження:</strong> Веде до штрафу у вигляді <strong>одиночного удару по базі</strong>.<br><strong>Вирішення конфліктів:</strong> Постраждалі можуть відкликати скаргу, якщо принесені вибачення.</p>
- title: "🤝 5. Переманювання гравців"
  content: >
    <p><strong>Активний набір:</strong> Заборонено писати учасникам інших NAP-альянсів з пропозицією змінити альянс.<br><strong>Автономія гравців:</strong> Гравці можуть вільно залишати альянси та вступати в інші добровільно.<br><strong>Заявки:</strong> 'Вхідні' заявки дозволені, якщо не було попереднього вербування.</p>
- title: "📉 6. Інші альянси"
  content: >
    <p><strong>Чесна гра:</strong> Заборонено атакувати слабші альянси тільки тому, що вони поза NAP.</p>
- title: "🕊️ 7. Дипломатія та вирішення конфліктів"
  content: >
    <p>1. <strong>Приватне вирішення:</strong> Спочатку вирішуйте спори в приватному порядку між главами/дипломатами альянсів.<br>2. <strong>Ескалація:</strong> Якщо не вирішено, звертайтеся до <strong>керівництва NAP</strong>.</p><blockquote>⚠️ Не виносьте спори про правила, образи чи драму в Загальний або Світовий чат. Використовуйте особисті канали.</blockquote>
- title: "🎓 8. Academies"
  content: >
    <p><strong>Позначення:</strong> Кожен NAP-альянс може захищати <strong>одну</strong> academy.<br><strong>Управління:</strong> Academies, що входять до Топ-10, не отримують права голосу, поки зберігають статус academy.</p>
- title: "⚠️ 9. Загальні порушення правил"
  content: >
    <p><em>(Окрім №4)</em></p><p><strong>1-ше порушення:</strong> Офіційне попередження.<br><strong>2-ге порушення:</strong> Виключення з альянсу або <strong>Чорний список NAP</strong>.<br><strong>Політика чорного списку:</strong> Забороняє вступ до будь-якого NAP-альянсу.</p>