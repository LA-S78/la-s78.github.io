- title: "📜 1. Respect & Conduite"
  content: >
    <p><strong>Tolérance zéro :</strong> Le harcèlement, le racisme, les discours haineux ou les comportements toxiques sont interdits.<br><strong>Norme communautaire :</strong> Traitez tous les joueurs avec respect.<br><strong>Signalement :</strong> Vous <strong>devez</strong> fournir des captures d'écran/preuves lors du signalement d'une infraction.</p>
- title: "🛡️ 2. Règles de Protection NAP"
  content: >
    <p>Les actions suivantes contre les <strong>Alliances NAP</strong> et leurs <strong>Academies</strong> sont interdites :</p><div style='background: rgba(180, 40, 40, 0.1); border: 1px solid #8b0000; padding: 10px; text-align: center; border-radius: 4px; color: #ff6b6b; margin-top: 10px;'>🚫 Pas d'attaque<br>🚫 Pas d'exploration</div>
- title: "💎 3. Étiquette des Ressources et de la Carte"
  content: >
    <p><strong>Sécurité des tuiles :</strong> Attaquer les tuiles de ressources est strictement interdit. Laissez les joueurs récolter en paix.</p>
- title: "🚛 4. Caravanes & Black Ops"
  content: >
    <p>Géré par un <strong>Système de Trois Avertissements</strong> :</p><p><strong>Avertissement 1 & 2 :</strong> Signalés par les R4. L'offenseur reçoit un avertissement formel.<br><strong>Avertissement 3 :</strong> Entraîne une pénalité de <strong>Coup de Base unique</strong>.<br><strong>Résolution de conflits :</strong> Les victimes peuvent annuler le signalement si des excuses sont acceptées.</p>
- title: "🤝 5. Débauchage de Membres"
  content: >
    <p><strong>Recrutement actif :</strong> Contacter des membres d'autres alliances NAP pour les faire changer d'alliance est interdit.<br><strong>Autonomie des joueurs :</strong> Les joueurs sont libres de quitter et de rejoindre des alliances volontairement.<br><strong>Candidatures :</strong> Les candidatures spontanées sont autorisées sans sollicitation préalable.</p>
- title: "📉 6. Autres Alliances"
  content: >
    <p><strong>Fair-play :</strong> Attaquer des alliances plus petites parce qu'elles sont hors NAP est interdit.</p>
- title: "🕊️ 7. Diplomatie & Résolution de Conflits"
  content: >
    <p>1. <strong>Résolution privée :</strong> Gérez les différends en privé entre les Chefs/Diplomates en priorité.<br>2. <strong>Escalade :</strong> Si non résolu, portez-le à la <strong>Direction NAP</strong>.</p><blockquote>⚠️ Ne portez pas les litiges, griefs ou drames sur le Chat Général ou Mondial. Gardez cela dans les canaux privés.</blockquote>
- title: "🎓 8. Academies"
  content: >
    <p><strong>Désignation :</strong> Chaque alliance NAP peut protéger <strong>une</strong> academy.<br><strong>Gouvernance :</strong> Les Academies entrant dans le Top 10 ne reçoivent pas de droits de vote tant qu'elles conservent leur statut d'academy.</p>
- title: "⚠️ 9. Violations Générales"
  content: >
    <p><em>(Sauf #4)</em></p><p><strong>1ère infraction :</strong> Avertissement officiel.<br><strong>2ème infraction :</strong> Exclusion de l'alliance ou <strong>Liste Noire NAP</strong>.<br><strong>Politique de Liste Noire :</strong> Interdit de rejoindre toute alliance protégée par le NAP.</p>