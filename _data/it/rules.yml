- title: "📜 1. Rispetto & Condotta"
  content: >
    <p><strong>Tolleranza Zero:</strong> Bullismo, razzismo, incitamento all'odio, molestie o comportamenti tossici sono proibiti.<br><strong>Standard della Community:</strong> Tratta tutti i giocatori con rispetto.<br><strong>Segnalazioni:</strong> È <strong>obbligatorio</strong> fornire screenshot/prove quando si segnala una violazione.</p>
- title: "🛡️ 2. Regole di Protezione NAP"
  content: >
    <p>Le seguenti azioni contro le <strong>Alleanze NAP</strong> e le loro <strong>Accademie</strong> sono proibite:</p><div style='background: rgba(180, 40, 40, 0.1); border: 1px solid #8b0000; padding: 10px; text-align: center; border-radius: 4px; color: #ff6b6b; margin-top: 10px;'>🚫 Niente Attacchi<br>🚫 Niente Esplorazioni</div>
- title: "💎 3. Etichetta su Risorse & Mappa"
  content: >
    <p><strong>Sicurezza delle Risorse:</strong> Attaccare i nodi di raccolta è severamente proibito. Lascia che i giocatori raccolgano in pace.</p>
- title: "🚛 4. Carovane & Operazioni Segrete"
  content: >
    <p>Regolato da un <strong>Sistema a Tre Ammonimenti</strong>:</p><p><strong>Ammonimento 1 & 2:</strong> Segnalato dagli R4. Il trasgressore riceve un avvertimento formale.<br><strong>Ammonimento 3:</strong> Risulta in una penalità di <strong>Un Attacco alla Base</strong>.<br><strong>Risoluzione dei Conflitti:</strong> Le vittime possono revocare la segnalazione se le scuse vengono accettate.</p>
- title: "🤝 5. Reclutamento Illecito"
  content: >
    <p><strong>Reclutamento Attivo:</strong> È proibito inviare messaggi a membri di altre alleanze NAP per convincerli a cambiare.<br><strong>Autonomia del Giocatore:</strong> I giocatori sono liberi di lasciare e unirsi alle alleanze volontariamente.<br><strong>Candidature:</strong> Le candidature 'spontanee' sono consentite, a condizione che non vi sia stata sollecitazione preventiva.</p>
- title: "📉 6. Altre Alleanze"
  content: >
    <p><strong>Fair Play:</strong> È vietato attaccare alleanze più piccole solo perché non rientrano nel NAP.</p>
- title: "🕊️ 7. Diplomazia & Risoluzione Conflitti"
  content: >
    <p>1. <strong>Risoluzione Privata:</strong> Gestire le dispute privatamente tra i Leader/Diplomatici delle alleanze.<br>2. <strong>Escalation:</strong> Se irrisolto, portare la questione alla <strong>Leadership NAP</strong>.</p><blockquote>⚠️ Non portare dispute sulle regole, reclami o drammi nella Chat Generale o Mondiale. Usa i canali privati.</blockquote>
- title: "🎓 8. Accademie"
  content: >
    <p><strong>Designazione:</strong> Ogni alleanza NAP può proteggere <strong>una</strong> accademia.<br><strong>Governance:</strong> Le accademie che entrano nella Top 10 non ricevono diritto di voto finché mantengono lo status di accademia.</p>
- title: "⚠️ 9. Violazioni Generali"
  content: >
    <p><em>(Eccetto #4)</em></p><p><strong>1° Infrazione:</strong> Avvertimento Ufficiale.<br><strong>2° Infrazione:</strong> Rimozione dall'alleanza o <strong>Lista Nera NAP</strong>.<br><strong>Politica Lista Nera:</strong> Vieta l'adesione a qualsiasi alleanza protetta da NAP.</p>