- title: "📜 1. Respekt & Verhalten"
  content: >
    <p><strong>Null-Toleranz:</strong> Mobbing, Rassismus, Hassrede, Belästigung oder toxisches Verhalten ist verboten.<br><strong>Gemeinschaftsstandard:</strong> Behandle alle Spieler mit Respekt.<br><strong>Meldung:</strong> Du <strong>musst</strong> Screenshots/Beweise vorlegen, wenn du einen Verstoß meldest.</p>
- title: "🛡️ 2. NAP-Schutzregeln"
  content: >
    <p>Folgende Aktionen gegen <strong>NAP-Allianzen</strong> und deren <strong>Academies</strong> sind verboten:</p><div style='background: rgba(180, 40, 40, 0.1); border: 1px solid #8b0000; padding: 10px; text-align: center; border-radius: 4px; color: #ff6b6b; margin-top: 10px;'>🚫 Nicht angreifen<br>🚫 Nicht ausspähen</div>
- title: "💎 3. Ressourcen & Kartenetikette"
  content: >
    <p><strong>Kachel-Sicherheit:</strong> Das Angreifen von Ressourcenkacheln ist strengstens verboten. Lass Spieler in Ruhe farmen.</p>
- title: "🚛 4. Caravans & Black Ops"
  content: >
    <p>Geregelt durch ein <strong>Drei-Strike-System</strong>:</p><p><strong>Strike 1 & 2:</strong> Gemeldet durch R4s. Täter erhält eine formelle Verwarnung.<br><strong>Strike 3:</strong> Führt zu einer Strafe von <strong>einem Basisangriff</strong>.<br><strong>Konfliktlösung:</strong> Opfer können auf den Report verzichten, wenn eine Entschuldigung akzeptiert wird.</p>
- title: "🤝 5. Abwerbeverbot"
  content: >
    <p><strong>Aktives Rekrutieren:</strong> Das Anschreiben von Mitgliedern anderer NAP-Allianzen zum Wechseln ist verboten.<br><strong>Spielerautonomie:</strong> Spieler können Allianzen freiwillig verlassen und beitreten.<br><strong>Bewerbungen:</strong> 'Spontane' Bewerber sind erlaubt, sofern keine vorherige Aufforderung erfolgte.</p>
- title: "📉 6. Andere Allianzen"
  content: >
    <p><strong>Fair Play:</strong> Das Angreifen kleinerer Allianzen, nur weil sie außerhalb des NAP sind, ist verboten.</p>
- title: "🕊️ 7. Diplomatie & Konfliktlösung"
  content: >
    <p>1. <strong>Private Lösung:</strong> Kläre Streitigkeiten zuerst privat zwischen Allianzleitern/Diplomaten.<br>2. <strong>Eskalation:</strong> Falls ungelöst, bringe es vor die <strong>NAP-Führung</strong>.</p><blockquote>⚠️ Bringe keine Regelstreitigkeiten, Beschwerden oder Drama in den General- oder Weltchat. Bleibe in privaten Kanälen.</blockquote>
- title: "🎓 8. Academies"
  content: >
    <p><strong>Bezeichnung:</strong> Jede NAP-Allianz darf <strong>eine</strong> academy schützen.<br><strong>Governance:</strong> Academies, die in die Top 10 aufsteigen, erhalten kein Stimmrecht, solange sie den Status einer academy behalten.</p>
- title: "⚠️ 9. Allgemeine Regelverstöße"
  content: >
    <p><em>(Außer #4)</em></p><p><strong>1. Verstoß:</strong> Offizielle Verwarnung.<br><strong>2. Verstoß:</strong> Ausschluss aus der Allianz oder <strong>NAP-Blacklist</strong>.<br><strong>Blacklist-Politik:</strong> Verbietet den Beitritt zu jeder NAP-geschützten Allianz.</p>