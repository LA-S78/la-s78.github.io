<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    
    <title>PWA Bleed Test V11</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100vh; 
            background: #1a1a2e;
            overflow: hidden; 
            font-family: sans-serif;
            color: white;
        }
        header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 50; /* Keeps it above the scrolling content */
    
    /* Ensure it covers the safe area */
    padding-top: env(safe-area-inset-top);
    
    /* Assuming your header is 90px tall (adjust this to your actual height) */
    height: calc(90px + env(safe-area-inset-top)); 
}

        main {
    /* Push the top of the content down exactly past the header */
    padding-top: calc(90px + env(safe-area-inset-top)); /* Must match header height */
    
    /* Push the bottom of the content up exactly past the footer */
    /* Estimate your footer's total height (e.g., 70px content + 20px padding) */
    padding-bottom: calc(90px + env(safe-area-inset-bottom)); 
    
    /* Let the body handle the scrolling naturally */
    width: 100%;
    min-height: 100dvh;
}

        footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 50; /* Keeps it above the scrolling content */
    
    /* Your adaptive safe area logic */
    padding-bottom: max(10px, calc(20px - env(safe-area-inset-bottom)));
    
    /* Assuming your footer content is about 70px tall */
    /* We don't need a strict height here, the padding handles the spacing */
}
    </style>
</head>
<body>
    <div id="mobile-container">
        <header>
            <strong>HEADER</strong><br>
            The top bleed is working flawlessly.
        </header>
        
        <main>
            <strong>MAIN CONTENT</strong><br>
            Scrolling in browser works smoothly, no overscroll.
        </main>
        
        <footer>
            <strong>FOOTER</strong><br>
            Using negative margin to pull this into the safe zone.
        </footer>
    </div>
</body>
</html>
