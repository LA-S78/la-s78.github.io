<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    
    <link rel="manifest" href="/site.webmanifest">
    
    <title>PWA Bleed Test V6</title>
    
    <style>
        /* Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* The Absolute Root */
        html, body {
            background: #1a1a2e;
            width: 100%;
            /* 100dvh (Dynamic Viewport Height) fixes the mobile browser scrolling issue */
            height: 100dvh; 
            /* Stop all scrolling/rubber-banding at the root level */
            overflow: hidden; 
            overscroll-behavior: none; 
            font-family: sans-serif;
        }

        /* Fallback for older browsers */
        @supports not (height: 100dvh) {
            html, body { height: 100vh; }
        }

        /* LAYER 1: The Bleed Layer (Blue) */
        #bleed-layer {
            position: absolute;
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0;
            border: 5px solid #60a5fa; /* Blue */
            background: rgba(96, 165, 250, 0.1);
            pointer-events: none;
        }

        /* LAYER 2: The Safe Content Layer (Red) */
        #safe-layer {
            position: absolute;
            /* Map this box strictly to the OS safe zones */
            top: env(safe-area-inset-top);
            bottom: env(safe-area-inset-bottom);
            left: env(safe-area-inset-left);
            right: env(safe-area-inset-right);
            
            border: 5px solid #f87171; /* Red */
            background: rgba(248, 113, 113, 0.1);
            
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <div id="bleed-layer"></div>
    
    <div id="safe-layer">
        <strong>The RED box</strong> should sit completely clear of the notch, status bar, and home bar.<br><br>
        <strong>The BLUE box</strong> should touch the absolute physical edges of the device glass.<br><br>
        There should be NO scrolling on any device.
    </div>
</body>
</html>
