<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- CRITICAL: Forces the OS to blend the system UI areas -->
    <meta name="theme-color" content="#000000">
    
    <link rel="manifest" href="/site.webmanifest">
    <title>PWA Bleed Test V4</title>
    
    <style>
        /* The Ultimate iOS Lockdown */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            
            /* Kill the rubber-banding completely */
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
        }

        #probe {
            position: absolute; /* Using absolute instead of fixed binds it to the body */
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            border: 10px solid red; 
            box-sizing: border-box;
            pointer-events: none; 
        }
    </style>
</head>
<body>
    <div id="probe"></div>
</body>
</html>
