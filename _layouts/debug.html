<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Added height=device-height -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Legacy iOS tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- CRITICAL: The Manifest linking -->
    <link rel="manifest" href="/site.webmanifest">
    
    <title>PWA Bleed Test V2</title>

    <style>
        /* Force the HTML to fill the absolute bounds of the device */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: black;
        }

        #probe {
            position: fixed; 
            top: 0; 
            left: 0; 
            /* Fallback to 100% if 100dvh fails */
            width: 100vw; 
            height: 100dvh; 
            border: 10px solid red; 
            box-sizing: border-box;
            pointer-events: none; 
            z-index: 999999;
        }

        /* Fallback for devices that don't understand dvh */
        @supports not (height: 100dvh) {
            #probe {
                height: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="probe"></div>
</body>
</html>
