<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- Reinstating the EXACT workers.dev tag that unlocked the screen in V5 -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    
    <link rel="manifest" href="/site.webmanifest">
    
    <title>PWA Bleed Test V8</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            background: #1a1a2e;
            /* Reinstating 100vh. This is the mandatory key for iOS PWA bleed. */
            height: 100vh;
            overflow: hidden; 
            font-family: sans-serif;
        }

        /* 
           THE FIX FOR FAULT #1: 
           If the user is in a normal browser (not installed), use dvh to prevent scrolling.
        */
        @media (display-mode: browser) {
            html, body {
                height: 100dvh;
            }
        }

        /* LAYER 1: The Bleed Layer (Blue) */
        #bleed-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; /* Maps exactly to the 100vh/100dvh of the body */
            border: 5px solid #60a5fa; 
            background: rgba(96, 165, 250, 0.1);
            pointer-events: none;
        }

        /* 
           THE FIX FOR FAULT #2:
           By using absolute positioning mapped to env(), we bypass the body padding glitch.
           The Red Box will sit exactly where the OS tells it to.
        */
        #safe-layer {
            position: absolute;
            top: env(safe-area-inset-top);
            bottom: env(safe-area-inset-bottom);
            left: env(safe-area-inset-left);
            right: env(safe-area-inset-right);
            
            border: 5px solid #f87171; 
            background: rgba(248, 113, 113, 0.1);
            
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <div id="bleed-layer"></div>
    
    <div id="safe-layer">
        <strong>V8: Back to what worked.</strong><br><br>
        Red box = Safe content.<br>
        Blue box = Glass edges.
    </div>
</body>
</html>
