<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    
    <link rel="manifest" href="/site.webmanifest">
    
    <title>PWA Bleed Test V7</title>
    
    <style>
        /* Base reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Lock the document without using vh or dvh */
        html, body {
            background: #1a1a2e;
            overflow: hidden; 
            overscroll-behavior: none; 
            touch-action: none;
            font-family: sans-serif;
        }

        /* LAYER 1: The Bleed Layer (Blue) */
        #bleed-layer {
            /* 'fixed' binds directly to the hardware screen */
            position: fixed;
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0;
            border: 5px solid #60a5fa; 
            background: rgba(96, 165, 250, 0.1);
            pointer-events: none;
        }

        /* LAYER 2: The Safe Content Layer (Red) */
        #safe-layer {
            /* Also 'fixed', but squeezed by the OS safe zones */
            position: fixed;
            top: env(safe-area-inset-top);
            bottom: env(safe-area-inset-bottom);
            left: env(safe-area-inset-left);
            right: env(safe-area-inset-right);
            
            border: 5px solid #f87171; 
            background: rgba(248, 113, 113, 0.1);
            
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: white;
        }
    </style>
</head>
<body>
    <div id="bleed-layer"></div>
    
    <div id="safe-layer">
        <strong>The RED box</strong> should sit completely clear of the notch, status bar, and home bar.<br><br>
        <strong>The BLUE box</strong> should touch the absolute physical edges of the device glass.<br><br>
        There should be NO scrolling on any device.
    </div>
</body>
</html>
