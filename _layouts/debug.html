<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <!-- THE MASTER VIEWPORT TAG -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no, viewport-fit=cover">

    <!-- Legacy iOS & PWA tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1512"> <!-- Set this to your var(--nav-bg) hex code -->
    
    <!-- We must include the manifest -->
    <link rel="manifest" href="/site.webmanifest">
    
    <title>PWA Bleed Test V5</title>
    
    <style>
        /* The exact CSS root rules from workers.dev */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            background: #1a1a2e; /* Matches theme-color */
            height: 100vh; /* CRITICAL: They use vh, not dvh or 100% */
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            
            /* The workers.dev site pads the BODY to push content safe, 
               letting the background color bleed to the edge */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* The flex container that holds the app */
        #app {
            flex-direction: column;
            min-height: 100%;
            display: flex;
            
            /* Debug Probe to visualize the container */
            border: 10px solid red;
        }
    </style>
</head>
<body>
    <div id="app">
        <div style="color: white; padding: 20px;">
            If this works, the red border will sit just INSIDE the safe area, but the dark blue background will bleed all the way behind the home indicator and notch.
        </div>
    </div>
</body>
</html>
