<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, shrink-to-fit=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    
    <title>PWA Bleed Test V11</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            height: 100vh; 
            background: #1a1a2e;
            overflow: hidden; 
            font-family: sans-serif;
            color: white;
        }

        #mobile-container {
            display: grid;
            grid-template-rows: auto 1fr auto; 
            /* CRITICAL: No overflow: hidden here, we need the footer to bleed out */
        }

        header {
            background: rgba(255, 0, 0, 0.2);
            border-top: 5px solid #f87171; 
            padding-top: env(safe-area-inset-top);
            padding-bottom: 20px;
            text-align: center;
        }

        main {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            overflow-y: auto; 
            text-align: center;
        }

        footer {
            background: rgba(0, 255, 0, 0.2);
            border-bottom: 5px solid #4ade80; 
            text-align: center;
            padding-top: 20px;
            
            /* ====================================================
               THE NEGATIVE MARGIN HACK 
               ==================================================== */
            /* 1. Pull the footer down into the body's gap */
            /*margin-bottom: calc(-1 * env(safe-area-inset-bottom));*/
            
            /* 2. Add that exact height back as padding so content isn't crushed */
            /*padding-bottom: calc(20px + env(safe-area-inset-bottom));*/
        }
    </style>
</head>
<body>
    <div id="mobile-container">
        <header>
            <strong>HEADER</strong><br>
            The top bleed is working flawlessly.
        </header>
        
        <main>
            <strong>MAIN CONTENT</strong><br>
            Scrolling in browser works smoothly, no overscroll.
        </main>
        
        <footer>
            <strong>FOOTER</strong><br>
            Using negative margin to pull this into the safe zone.
        </footer>
    </div>
</body>
</html>
