# Calendar reminders: asks the site to check for events starting within the hour and post
# their Discord reminders (api/_reminders.js, through POST /api/calendar). The work and its
# secrets (Gist, bot token, channels) stay on Vercel; this only proves the call comes from
# here with REMINDER_SECRET (the same value as Vercel's).
#
# The every-10-minutes check is NOT run from here: GitHub's schedule never started for this
# workflow, and is often late or skipped when it does run. cron-job.org calls the site
# directly instead (owner decision, 2026-11-13; set-up in docs/DECISIONS.md). Two callers at
# once could post a reminder twice, so this workflow has no schedule: "Run workflow"
# (Actions tab) runs one check by hand, on either site, as a dry run if wanted; its report is
# printed in the run's log.
#
# Safety: the live site posts nothing until REMINDERS_LIVE=true is set in Vercel (until then
# it only reports what it would send). dev.la-s78.app uses the test data and posts only to
# TEST_CHANNEL_ID.

name: Calendar reminders

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Which site checks'
        type: choice
        options: [dev, live, both]
        default: dev
      dry_run:
        description: 'Only report what would be sent'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: calendar-reminders
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the site to check reminders
        env:
          REMINDER_SECRET: ${{ secrets.REMINDER_SECRET }}
          # dev.la-s78.app is a Vercel preview behind Vercel Authentication; this key (Vercel →
          # Settings → Deployment Protection → Protection Bypass for Automation) lets the check in
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SITE: ${{ inputs.site }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A pasted secret often ends with a line break, which curl refuses in a header
          # ("bad argument"); the site ignores spaces and line breaks around it too
          REMINDER_SECRET="$(printf '%s' "$REMINDER_SECRET" | tr -d '[:space:]')"
          VERCEL_BYPASS="$(printf '%s' "$VERCEL_BYPASS" | tr -d '[:space:]')"
          if [ -z "$REMINDER_SECRET" ]; then
            echo "::error::The REMINDER_SECRET secret is not set (Settings → Secrets → Actions)."
            exit 1
          fi
          case "$SITE" in
            dev) urls="https://dev.la-s78.app" ;;
            live) urls="https://la-s78.app" ;;
            *) urls="https://dev.la-s78.app https://la-s78.app" ;;
          esac
          status=0
          for url in $urls; do
            echo "== $url (dry run: $DRY_RUN)"
            bypass=()
            if [ "$url" = "https://dev.la-s78.app" ]; then
              if [ -n "$VERCEL_BYPASS" ]; then
                bypass=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS")
              else
                echo "::warning::No VERCEL_AUTOMATION_BYPASS_SECRET secret: Vercel will refuse the dev site (Protected deployment)."
              fi
            fi
            if ! curl -sS --fail-with-body --max-time 40 -X POST "$url/api/calendar" \
                "${bypass[@]}" \
                -H "Content-Type: application/json" \
                -H "x-reminder-secret: $REMINDER_SECRET" \
                -d "{\"action\":\"check-reminders\",\"dryRun\":$DRY_RUN}"; then
              echo "::warning::$url did not complete the reminder check."
              status=1
            fi
            echo
          done
          exit $status
