name: Build and Deploy Multilingual Site

on:
  push:
    branches: [main, dev]
  # Pull requests run the full build + sanity checks, but never translate,
  # commit, deploy or post alerts (all deploy-side steps are gated on push).
  pull_request:
    branches: [main, dev]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setting up Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # --- TRANSLATE VIA AI (UPGRADED TO RECURSIVE DEEP SCAN) ---
      - name: Translating source text via AI
        if: github.event_name == 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if find _source/ -type f -name "*_en.md" | grep -q .; then
            echo "Drafts detected. Running AI Localization..."
            bundle exec ruby _scripts/generate_master.rb
          else
            echo "No English source drafts found. Skipping."
          fi

      # --- FIXED INTERCEPT STAGE FOR UNTRACKED FILES ---
      - name: Saving master translation files
        if: github.event_name == 'push'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Force stage the directory first so Git registers new untracked files
          git add _source/
          
          # Safely check the staged index for differences
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate master files from AI drafts [skip ci]"
            git push
          fi

      # --- DIVIDING ENGINE (UPGRADED TO NESTED PREFERENCE SUPPORT) ---
      - name: Dividing translated pages
        run: |
          ruby -r fileutils -e '
            puts "Starting format-agnostic segregation engine..."
            Dir.glob("_source/**/*.md").each do |file_path|
              content = File.read(file_path)
              
              normalized_content = content.gsub(/<guide\s+lang="([^"]+)"\s+category="([^"]+)"\s+name="([^"]+)">/, "=== guide--\\1--\\2--\\3 ===")
              normalized_content = normalized_content.gsub(/<pane\s+lang="([^"]+)"\s+category="([^"]+)"\s+name="([^"]+)"\s+section="([^"]+)">/, "=== pane--\\1--\\2--\\3--\\4 ===")
              normalized_content = normalized_content.gsub(/<data\s+lang="([^"]+)"\s+name="([^"]+)">/, "=== data--\\1--\\2 ===")
              
              blocks = normalized_content.split(/^===\s*(\S+)\s*===/)
              next if blocks.length < 2
              
              (1...blocks.length).step(2) do |i|
                header = blocks[i].strip
                block_content = blocks[i+1].gsub("\r\n", "\n").strip
                next if block_content.empty?
                
                allowed_patterns = [
                  /^page--\S+$/,
                  /^collection--\S+--\d+$/,
                  /^guide--\S+--\S+--\S+$/,
                  /^pane--\S+--\S+--\S+--\S+$/,
                  /^data--\S+--\S+$/
                ]
                unless allowed_patterns.any? { |p| header =~ p }
                  raise "CRITICAL BUILD ERROR: Invalid header [#{header}]. Check markers!"
                end
                
                parts = header.split("--")
                type = parts[0].strip
                
                case type
                when "page"
                  dest_file = "./#{parts[1].strip}.md"
                when "collection"
                  dest_dir = "collections/_#{parts[1].strip}"
                  dest_file = "#{dest_dir}/#{parts[2].strip}-#{parts[1].strip}.md"
                when "guide"
                  lang, cat, name = parts[1], parts[2], parts[3]
                  block_content = block_content.sub(/^---/, "---\nlang: #{lang}") unless block_content =~ /^lang:\s*/
                  dest_dir = "guides/#{lang}/#{cat}"
                  dest_file = "#{dest_dir}/#{name}.md"
                when "pane"
                  lang, cat, name, step, pane = parts[1], parts[2], parts[3], parts[4], parts[5]
                  dest_dir = "collections/_guide_panes/#{lang}/#{cat}/#{name}"
                  dest_file = "#{dest_dir}/#{step}-#{pane}.md"
                when "data"
                  lang, filename = parts[1].strip, parts[2].strip
                  dest_dir = "_data/#{lang}"
                  dest_file = "#{dest_dir}/#{filename}.yml"
                end
                
                # --- CLEAN UP CONTENT ---
                clean_content = block_content.gsub(/<\/?data[^>]*>/, "")
                clean_content = clean_content.gsub(/^```[a-z]*\n?/i, "").gsub(/\n?```$/, "").strip
                
                FileUtils.mkdir_p(File.dirname(dest_file))
                File.write(dest_file, clean_content + "\n")
                puts "✅ Segregated -> #{dest_file}"
              end
            end
          '

      - name: Injecting UI navigation text
        run: bundle exec ruby _scripts/sync_ui_data.rb

      - name: Generate Discord API Translations
        run: bundle exec ruby _scripts/build_translations.rb
          
      # --- COMPILING ENGINE ---
      - name: Compiling regional sites
        env:
          JEKYLL_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
        run: |
          set -o pipefail
          # Keep pristine copies OUTSIDE the Jekyll source tree so they are never
          # picked up as pages (previously caused ~99 permalink conflicts per build
          # and ~2,000 junk pages under /<lang>/guide_panes_backup/).
          BACKUP_DIR=$(mktemp -d)
          cp -r guides "$BACKUP_DIR/guides"
          cp -r collections/_guide_panes "$BACKUP_DIR/guide_panes"

          isolate_lang() {
            rm -rf guides collections/_guide_panes
            cp -r "$BACKUP_DIR/guides" guides
            cp -r "$BACKUP_DIR/guide_panes" collections/_guide_panes
            find guides -mindepth 1 -maxdepth 1 -type d ! -name "$1" -exec rm -rf {} +
            find collections/_guide_panes -mindepth 1 -maxdepth 1 -type d ! -name "$1" -exec rm -rf {} +
          }

          # Root build uses the English config so root URLs (/rules.html, /404.html, ...)
          # render real content and link to /en/... instead of protocol-relative //rules.html.
          echo "Compiling English root site..."
          isolate_lang en
          bundle exec jekyll build --config _config.yml,_configs/_config_en.yml --destination _site/ 2>&1 | tee -a "$RUNNER_TEMP/jekyll-build.log"

          echo "Scanning for localized language configuration files..."
          for config_file in _configs/_config_*.yml; do
            [ -e "$config_file" ] || continue
            lang=$(basename "$config_file" | sed 's/_config_\(.*\)\.yml/\1/')

            isolate_lang "$lang"

            echo "🚀 Executing clean isolated regional build for: [$lang]..."
            bundle exec jekyll build --config _config.yml,"$config_file" --destination _site/$lang 2>&1 | tee -a "$RUNNER_TEMP/jekyll-build.log"

            # Pages reference shared assets by absolute path (/css, /js, /images), so the
            # per-language copies are never used. Dropping them shrinks the deploy ~9x.
            rm -rf "_site/$lang/images" "_site/$lang/css" "_site/$lang/js"
          done

          rm -rf guides collections/_guide_panes
          mv "$BACKUP_DIR/guides" guides
          mv "$BACKUP_DIR/guide_panes" collections/_guide_panes
          rm -rf "$BACKUP_DIR"

          cp -r images _site/
          cp -r css _site/
          cp -r js _site/
          cp site.webmanifest _site/

          cp redirect.html _site/index.html

          # Re-apply the JS URL patch module onto non-production assets
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Dev branch detected. Injecting global URL catch-all patch..."
            cat js/dev-url-fixer.js >> _site/js/main.js
          fi

          echo "Running Workbox injector..."
          ruby -r ./_scripts/workbox_precache.rb -e "WorkboxInjector.run('_site')"
          
          # 1. Compile map.svg into in-memory JS module (ignored as endpoint by Vercel)
          ruby -r json -e '
            svg_text = File.read("_includes/map.svg")
            File.write("api/_map_svg.js", "export default " + JSON.generate(svg_text) + ";\n")
            puts "✅ Generated api/_map_svg.js"
          '

          # 2. Compile _data/cities.yml into in-memory JS module (ignored as endpoint by Vercel)
          ruby -r yaml -r json -e '
            cities = YAML.load_file("_data/cities.yml") rescue {}
            File.write("api/_cities_data.js", "export default " + JSON.generate(cities) + ";\n")
            puts "✅ Generated api/_cities_data.js (#{cities.keys.size} cities)"
          '

          # 3. Extract runner DejaVuSans-Bold TTF into in-memory Base64 JS module (ignored as endpoint by Vercel)
          ruby -r base64 -e '
            candidates = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
            ]
            font_path = candidates.find { |p| File.exist?(p) } || Dir.glob("/usr/share/fonts/**/*.ttf").first

            if font_path
              b64 = Base64.strict_encode64(File.binread(font_path))
              File.write("api/_font_data.js", "export default \"" + b64 + "\";\n")
              puts "✅ In-memory font module generated from #{font_path}."
            else
              File.write("api/_font_data.js", "export default \"\";\n")
              puts "⚠️ Warning: No system font found."
            end
          '

          # Stage serverless assets and configuration for Vercel
          cp -r api _site/
          cp package*.json _site/ 2>/dev/null || cp package.json _site/
          cp vercel.json _site/ 2>/dev/null || true

      - name: Checking build output
        run: |
          fail=0

          # 1. Jekyll must not report two sources writing the same output file.
          if grep -q "Conflict: The following destination is shared" "$RUNNER_TEMP/jekyll-build.log"; then
            echo "::error::Jekyll reported destination conflicts:"
            grep -A3 "Conflict:" "$RUNNER_TEMP/jekyll-build.log" | head -40
            fail=1
          fi

          # 2. Every language (plus the root) must have its core pages.
          for dir in _site _site/de _site/en _site/es _site/fr _site/it _site/ru _site/tr _site/uk; do
            for page in index.html rules.html alliance.html guides/index.html; do
              [ -f "$dir/$page" ] || { echo "::error::Missing $dir/$page"; fail=1; }
            done
          done

          # 3. No backup or build-only folders may leak into the published site.
          leaked=$(find _site -path _site/api -prune -o \( -name '*_backup' -o -name 'node_modules' -o -name 'vendor' \) -print)
          if [ -n "$leaked" ]; then
            echo "::error::Build-only folders were published:"; echo "$leaked"; fail=1
          fi

          # 4. No protocol-relative links like href="//rules.html" (sign of an empty active_lang).
          if grep -rlE 'href="//[a-z_]+\.html' _site --include=*.html | head -5 | grep -q .; then
            echo "::error::Found protocol-relative page links (empty site.active_lang?):"
            grep -rlE 'href="//[a-z_]+\.html' _site --include=*.html | head -5
            fail=1
          fi

          # 5. Keep the service-worker precache small (first visit downloads all of it).
          precache_kb=$(ruby -rjson -e 'list = JSON.parse(File.read("_site/sw.js")[/precacheList = (\[.*?\]);/m, 1]); puts list.sum { |e| File.size("_site" + e["url"]) } / 1024')
          echo "Service-worker precache: ${precache_kb} KB"
          if [ "$precache_kb" -gt 20480 ]; then
            echo "::error::Precache is ${precache_kb} KB (limit 20 MB). Check _scripts/workbox_precache.rb."; fail=1
          fi

          exit $fail

      - name: Uploading build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-site
          path: _site/
          retention-days: 1

      - name: Preparing fallback redirects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir _github_pages_site
          cp migration.html _github_pages_site/index.html
          # GitHub Pages serves 404.html for any unknown path, so old deep links
          # (e.g. /en/rules.html) also reach the path-preserving redirect.
          cp migration.html _github_pages_site/404.html

      - name: Caching deployment state
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/com.vercel.cli
          key: ${{ runner.os }}-vercel-${{ hashFiles('**/_site/**') }}
          restore-keys: |
            ${{ runner.os }}-vercel-

      - name: Installing deployment tools
        if: github.event_name == 'push'
        run: npm install --global vercel@latest

      - name: Fetching deployment environment
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Staging deployment folder
        if: github.event_name == 'push'
        run: cp -r .vercel _site/

      - name: Deploying to Vercel
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel deploy --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }} --cwd _site/
          else
            DEPLOY_URL=$(vercel deploy --archive=tgz --token=${{ secrets.VERCEL_TOKEN }} --cwd _site/)
            vercel alias set "$DEPLOY_URL" dev.la-s78.app --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploying redirects to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _github_pages_site
          clean: true

      - name: Sending success alert
        if: success() && github.event_name == 'push'
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "✅ **Build Succeeded!** The latest layout changes are officially live on Vercel for the `'"${{ github.ref_name }}"'` branch."}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Sending failure alert
        if: failure() && github.event_name == 'push'
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "🚨 **Build Failed!** The deployment compilation crashed on the `'"${{ github.ref_name }}"'` branch. Check the GitHub Actions logs to see what broke."}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}