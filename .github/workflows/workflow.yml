name: Build and Deploy Multilingual Site

on:
  push:
    branches: [main, dev]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setting up Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # --- TRANSLATE VIA AI (UPGRADED TO RECURSIVE DEEP SCAN) ---
      - name: Translating source text via AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if find _source/ -type f -name "*_en.md" | grep -q .; then
            echo "Drafts detected. Running AI Localization..."
            bundle exec ruby _scripts/generate_master.rb
          else
            echo "No English source drafts found. Skipping."
          fi

      # --- FIXED INTERCEPT STAGE FOR UNTRACKED FILES ---
      - name: Saving master translation files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Force stage the directory first so Git registers new untracked files
          git add _source/
          
          # Safely check the staged index for differences
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-generate master files from AI drafts [skip ci]"
            git push
          fi

      # --- DIVIDING ENGINE (UPGRADED TO NESTED PREFERENCE SUPPORT) ---
      - name: Dividing translated pages
        run: |
          ruby -r fileutils -e '
            puts "Starting format-agnostic segregation engine..."
            Dir.glob("_source/**/*.md").each do |file_path|
              content = File.read(file_path)
              
              normalized_content = content.gsub(/<guide\s+lang="([^"]+)"\s+category="([^"]+)"\s+name="([^"]+)">/, "=== guide--\\1--\\2--\\3 ===")
              normalized_content = normalized_content.gsub(/<pane\s+lang="([^"]+)"\s+category="([^"]+)"\s+name="([^"]+)"\s+section="([^"]+)">/, "=== pane--\\1--\\2--\\3--\\4 ===")
              normalized_content = normalized_content.gsub(/<data\s+lang="([^"]+)"\s+name="([^"]+)">/, "=== data--\\1--\\2 ===")
              
              blocks = normalized_content.split(/^===\s*(\S+)\s*===/)
              next if blocks.length < 2
              
              (1...blocks.length).step(2) do |i|
                header = blocks[i].strip
                block_content = blocks[i+1].gsub("\r\n", "\n").strip
                next if block_content.empty?
                
                allowed_patterns = [
                  /^page--\S+$/,
                  /^collection--\S+--\d+$/,
                  /^guide--\S+--\S+--\S+$/,
                  /^pane--\S+--\S+--\S+--\S+--\S+$/,
                  /^data--\S+--\S+$/
                ]
                unless allowed_patterns.any? { |p| header =~ p }
                  raise "CRITICAL BUILD ERROR: Invalid header [#{header}]. Check markers!"
                end
                
                parts = header.split("--")
                type = parts[0].strip
                
                case type
                when "page"
                  dest_file = "./#{parts[1].strip}.md"
                when "collection"
                  dest_dir = "collections/_#{parts[1].strip}"
                  dest_file = "#{dest_dir}/#{parts[2].strip}-#{parts[1].strip}.md"
                when "guide"
                  lang, cat, name = parts[1], parts[2], parts[3]
                  block_content = block_content.sub(/^---/, "---\nlang: #{lang}") unless block_content =~ /^lang:\s*/
                  dest_dir = "guides/#{lang}/#{cat}"
                  dest_file = "#{dest_dir}/#{name}.md"
                when "pane"
                  lang, cat, name, step, pane = parts[1], parts[2], parts[3], parts[4], parts[5]
                  dest_dir = "collections/_guide_panes/#{lang}/#{cat}/#{name}"
                  dest_file = "#{dest_dir}/#{step}-#{pane}.md"
                when "data"
                  lang, filename = parts[1].strip, parts[2].strip
                  dest_dir = "_data/#{lang}"
                  dest_file = "#{dest_dir}/#{filename}.yml"
                end
                
                # --- CLEAN UP CONTENT ---
                clean_content = block_content.gsub(/<\/?data[^>]*>/, "")
                clean_content = clean_content.gsub(/^```[a-z]*\n?/i, "").gsub(/\n?```$/, "").strip
                
                FileUtils.mkdir_p(File.dirname(dest_file))
                File.write(dest_file, clean_content + "\n")
                puts "✅ Segregated -> #{dest_file}"
              end
            end
          '

      - name: Injecting UI navigation text
        run: bundle exec ruby _scripts/sync_ui_data.rb

      - name: Generate Discord API Translations
        run: bundle exec ruby _scripts/build_translations.rb
          
      # --- COMPILING ENGINE ---
      - name: Compiling regional sites
        env:
          JEKYLL_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
        run: |
          cp -r guides guides_backup
          cp -r collections/_guide_panes guide_panes_backup

          echo "Isolating English assets for primary root compilation..."
          find guides -mindepth 1 -maxdepth 1 -type d ! -name "en" -exec rm -rf {} +
          find collections/_guide_panes -mindepth 1 -maxdepth 1 -type d ! -name "en" -exec rm -rf {} +
          
          bundle exec jekyll build --config _config.yml --destination _site/
          
          echo "Scanning for localized language configuration files..."
          for config_file in _configs/_config_*.yml; do
            [ -e "$config_file" ] || continue
            lang=$(basename "$config_file" | sed 's/_config_\(.*\)\.yml/\1/')
            
            rm -rf guides collections/_guide_panes
            cp -r guides_backup guides
            cp -r guide_panes_backup collections/_guide_panes
            
            find guides -mindepth 1 -maxdepth 1 -type d ! -name "$lang" -exec rm -rf {} +
            find collections/_guide_panes -mindepth 1 -maxdepth 1 -type d ! -name "$lang" -exec rm -rf {} +
            
            echo "🚀 Executing clean isolated regional build for: [$lang]..."
            bundle exec jekyll build --config _config.yml,"$config_file" --destination _site/$lang
          done
          
          rm -rf guides collections/_guide_panes
          mv guides_backup guides
          mv guide_panes_backup collections/_guide_panes
          
          cp -r images _site/
          cp -r css _site/
          cp -r js _site/
          cp site.webmanifest _site/
          
          cp redirect.html _site/index.html

          # Re-apply the JS URL patch module onto non-production assets
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Dev branch detected. Injecting global URL catch-all patch..."
            cat js/dev-url-fixer.js >> _site/js/main.js
            
            for config_file in _configs/_config_*.yml; do
              [ -e "$config_file" ] || continue
              lang=$(basename "$config_file" | sed 's/_config_\(.*\)\.yml/\1/')
              
              if [ -f "_site/$lang/js/main.js" ]; then
                echo "Injecting dev fix into localized subfolder script bundle: /$lang..."
                cat js/dev-url-fixer.js >> _site/$lang/js/main.js
              fi
            done
          fi

          echo "Running Workbox injector..."
          ruby -r ./_scripts/workbox_precache.rb -e "WorkboxInjector.run('_site')"
          
          # 1. Compile map.svg into in-memory JS module
          ruby -r json -e '
            svg_text = File.read("_includes/map.svg")
            File.write("api/map_svg.js", "export default " + JSON.generate(svg_text) + ";\n")
          '

          # 2. Comprehensive Centroid Extractor (Matches <g>, <path>, <polygon>, and inkscape:label)
          ruby -r yaml -r json -e '
            cities_data = YAML.load_file("_data/cities.yml") rescue {}
            catalog_ids = cities_data.keys
            svg = File.read("_includes/map.svg")
            centroids = {}

            extract_points = lambda do |snippet|
              pts_x = []
              pts_y = []
              
              # Extract path d coordinates
              snippet.scan(/\bd=["\x27]([^"\x27]+)["\x27]/i) do |(d)|
                cur_x = 0.0
                cur_y = 0.0
                d.scan(/([a-df-z])([^a-df-z]*)/i) do |cmd, args_str|
                  nums = args_str.scan(/[-+]?(?:\d*\.\d+|\d+)(?:[eE][-+]?\d+)?/).map(&:to_f)
                  is_rel = (cmd == cmd.downcase)
                  case cmd.upcase
                  when "M", "L", "T"
                    nums.each_slice(2) do |x, y|
                      break unless x && y
                      cur_x = is_rel ? cur_x + x : x
                      cur_y = is_rel ? cur_y + y : y
                      pts_x << cur_x; pts_y << cur_y
                    end
                  when "H"
                    nums.each { |x| cur_x = is_rel ? cur_x + x : x; pts_x << cur_x }
                  when "V"
                    nums.each { |y| cur_y = is_rel ? cur_y + y : y; pts_y << cur_y }
                  when "C"
                    nums.each_slice(6) do |_x1, _y1, _x2, _y2, x, y|
                      break unless x && y
                      cur_x = is_rel ? cur_x + x : x
                      cur_y = is_rel ? cur_y + y : y
                      pts_x << cur_x; pts_y << cur_y
                    end
                  when "S", "Q"
                    nums.each_slice(4) do |_x1, _y1, x, y|
                      break unless x && y
                      cur_x = is_rel ? cur_x + x : x
                      cur_y = is_rel ? cur_y + y : y
                      pts_x << cur_x; pts_y << cur_y
                    end
                  when "A"
                    nums.each_slice(7) do |_rx, _ry, _rot, _laf, _sf, x, y|
                      break unless x && y
                      cur_x = is_rel ? cur_x + x : x
                      cur_y = is_rel ? cur_y + y : y
                      pts_x << cur_x; pts_y << cur_y
                    end
                  end
                end
              end

              # Extract polygon points coordinates
              snippet.scan(/\bpoints=["\x27]([^"\x27]+)["\x27]/i) do |(pts_str)|
                nums = pts_str.scan(/[-+]?(?:\d*\.\d+|\d+)/).map(&:to_f)
                nums.each_slice(2) { |x, y| pts_x << x; pts_y << y if x && y }
              end

              [pts_x, pts_y]
            end

            # Map directly by catalog IDs (checks id and inkscape:label)
            catalog_ids.each do |cid|
              escaped_id = Regexp.escape(cid)
              escaped_label = Regexp.escape(cid.tr("_", " "))
              
              # Check for group tag <g ...>...</g>
              pattern_g = /<g\b[^>]*?(?:id=["\x27]#{escaped_id}["\x27]|inkscape:label=["\x27](#{escaped_id}|#{escaped_label})["\x27])[^>]*>(.*?)<\/g>/im
              if (m = svg.match(pattern_g))
                xs, ys = extract_points.call(m[0])
                if xs.any? && ys.any?
                  centroids[cid] = {
                    "x" => ((xs.min + xs.max) / 2.0).round(1),
                    "y" => ((ys.min + ys.max) / 2.0).round(1),
                    "width" => (xs.max - xs.min).round(1),
                    "height" => (ys.max - ys.min).round(1)
                  }
                  next
                end
              end

              # Check for self-closing or leaf tags (<path>, <polygon>, <rect>)
              pattern_leaf = /<(?:path|polygon|rect)\b[^>]*?(?:id=["\x27]#{escaped_id}["\x27]|inkscape:label=["\x27](#{escaped_id}|#{escaped_label})["\x27])[^>]*>/im
              if (m = svg.match(pattern_leaf))
                xs, ys = extract_points.call(m[0])
                if xs.any? && ys.any?
                  centroids[cid] = {
                    "x" => ((xs.min + xs.max) / 2.0).round(1),
                    "y" => ((ys.min + ys.max) / 2.0).round(1),
                    "width" => (xs.max - xs.min).round(1),
                    "height" => (ys.max - ys.min).round(1)
                  }
                end
              end
            end

            # Fallback: scan any remaining paths/polygons with an ID
            svg.scan(/<(path|polygon)\b([^>]+)>/i) do |_tag, attrs|
              id = attrs[/id=["\x27]([^"\x27]+)["\x27]/, 1]
              next unless id && !centroids.key?(id)
              next if id == "layer1" || id.start_with?("defs") || id.include?("label")
              xs, ys = extract_points.call(attrs)
              if xs.any? && ys.any?
                centroids[id] = {
                  "x" => ((xs.min + xs.max) / 2.0).round(1),
                  "y" => ((ys.min + ys.max) / 2.0).round(1),
                  "width" => (xs.max - xs.min).round(1),
                  "height" => (ys.max - ys.min).round(1)
                }
              end
            end

            File.write("api/centroids.js", "export default " + JSON.generate(centroids) + ";\n")
            matched = catalog_ids.count { |c| centroids.key?(c) }
            puts "✅ Centroid calculation complete: Matched #{matched}/#{catalog_ids.size} catalog cities (Total targets: #{centroids.size})."
          '

          # 3. Base64-encode runner system font into in-memory JS module
          ruby -r base64 -e '
            candidates = [
              "_assets/fonts/Oswald-Bold.ttf",
              "_assets/fonts/font.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
            ]
            font_path = candidates.find { |p| File.exist?(p) && File.size(p) > 1000 }
            font_path ||= Dir.glob("/usr/share/fonts/**/{*Bold*,*bold*,*DejaVu*,*Liberation*}.ttf").first
            font_path ||= Dir.glob("/usr/share/fonts/**/*.ttf").first

            if font_path
              b64 = Base64.strict_encode64(File.binread(font_path))
              File.write("api/font_data.js", "export default \"" + b64 + "\";\n")
              puts "✅ In-memory font module generated from #{font_path} (#{File.size(font_path) / 1024} KB)."
            else
              File.write("api/font_data.js", "export default \"\";\n")
              puts "⚠️ Warning: No system font found."
            end
          '

          # Stage serverless assets and configuration for Vercel
          cp -r api _site/
          cp package*.json _site/ 2>/dev/null || cp package.json _site/
          cp vercel.json _site/ 2>/dev/null || true

      - name: Uploading build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-site
          path: _site/
          retention-days: 1

      - name: Preparing fallback redirects
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir _github_pages_site
          cp migration.html _github_pages_site/index.html

      - name: Caching deployment state
        uses: actions/cache@v4
        with:
          path: ~/.local/share/com.vercel.cli
          key: ${{ runner.os }}-vercel-${{ hashFiles('**/_site/**') }}
          restore-keys: |
            ${{ runner.os }}-vercel-

      - name: Installing deployment tools
        run: npm install --global vercel@latest

      - name: Fetching deployment environment
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Staging deployment folder
        run: cp -r .vercel _site/

      - name: Deploying to Vercel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel deploy --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }} --cwd _site/
          else
            DEPLOY_URL=$(vercel deploy --archive=tgz --token=${{ secrets.VERCEL_TOKEN }} --cwd _site/)
            vercel alias set "$DEPLOY_URL" dev.la-s78.app --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploying redirects to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _github_pages_site
          clean: true

      - name: Sending success alert
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "✅ **Build Succeeded!** The latest layout changes are officially live on Vercel for the `'"${{ github.ref_name }}"'` branch."}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Sending failure alert
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content": "🚨 **Build Failed!** The deployment compilation crashed on the `'"${{ github.ref_name }}"'` branch. Check the GitHub Actions logs to see what broke."}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}