name: Build and Deploy Multilingual Site

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          
      - name: Build All Languages
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build --config _config.yml --destination _site/
          
          for lang in en de es fr ru tr uk it; do
            echo "Building $lang..."
            bundle exec jekyll build --config _config.yml,_configs/_config_$lang.yml --destination _site/$lang
          done
          
          # Move FRONTEND assets into place
          cp -r images _site/
          cp -r css _site/
          cp -r js _site/
          cp site.webmanifest _site/
          cp redirect.html _site/index.html

          # RUN WORKBOX BEFORE ADDING THE BACKEND API FOLDER
          echo "Running Workbox injector..."
          ruby -r ./_plugins/workbox_precache.rb -e "WorkboxInjector.run('_site')"
          
          # INJECT API SECRETS SAFELY OUTSIDE THE CACHE LOOP
          cp -r api _site/

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Compiled Site to Vercel
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd _site/
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}