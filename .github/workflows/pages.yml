name: Build Multilingual Site

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          
      - name: Build All Languages
        env:
          JEKYLL_ENV: production
        run: |
          # 1. Build each language into its own subdirectory
          for lang in en de es fr ru tr uk it; do
            echo "Building $lang..."
            bundle exec jekyll build --config _config.yml,_configs/_config_$lang.yml --destination _site/$lang
          done
          
          # 2. Copy static assets to the root of _site/
          # This makes them available at /images/, /css/, and /js/ for all languages
          cp -r images _site/
          cp -r css _site/
          cp -r js _site/

          # 3. MANUALLY RUN THE PRECACHE GENERATOR
          # We provide a dummy 'site' object to our script
          echo "Running Workbox injector..."
          ruby -r ./_plugins/workbox_precache.rb -e "WorkboxInjector.run('_site')"

          #debug
          echo "Verifying file content after injection:"
          head -n 10 _site/sw.js

          # 4. Copy PWA essentials to the root of _site/
          cp site.webmanifest _site/
          cp sw.js _site/
          
          # 5. Copy the redirect file to the root
          cp redirect.html _site/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
