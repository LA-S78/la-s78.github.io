name: Copy live data to test Gist

# Run by hand (Actions tab -> this workflow -> Run workflow). Copies the live data into the
# test Gist used by dev.la-s78.app; it only reads the live Gist.
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installing Vercel tools
        run: npm install --global vercel@latest

      # The Gist settings live in Vercel: download them (Production = live, Preview = test)
      # with the same access key the deploy uses. Nothing is printed.
      - name: Fetching the data settings from Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} > /dev/null
          cp .vercel/.env.production.local .vercel/live.env
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }} > /dev/null
          cp .vercel/.env.preview.local .vercel/test.env

      - name: Copy the data
        # Optional overrides, only needed if a value is marked "Sensitive" in Vercel
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TEST_GIST_ID: ${{ secrets.TEST_GIST_ID }}
          TEST_GIST_TOKEN: ${{ secrets.TEST_GIST_TOKEN }}
        run: node _scripts/copy_live_to_test_gist.mjs
